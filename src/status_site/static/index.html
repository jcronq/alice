<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alice — status</title>
<!--
  Reactive status-site shell (#639 + #651).

  SSE-driven React shell. The first SSE frame is a full snapshot;
  subsequent `section.update` frames patch one section's state. Overview
  section payloads are typed dicts (``{markdown, rows, ...}``) rendered
  by the slice-2 widgets.

  Dynamic pages (Chat, Bugs, per-item Review) come through the same SSE
  stream as A2UI (``page:<slug>``) sections: each payload is
  ``{"a2ui": [createSurface, updateComponents, updateDataModel, ...]}``
  and renders through the generic ``A2uiSurface`` component. Hash routes
  (``#chat``, ``#bugs``, ``#review-<slug>``) pick which surface the
  shell mounts.
-->
<link rel="stylesheet" href="design-tokens.css">
<style>
/* Shell-specific styles — tokens live in design-tokens.css. */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg);
  font: var(--dash-font-size-body)/1.55 var(--font-sans);
}
header {
  position: sticky; top: 0; z-index: 2;
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border-line);
  padding: .6rem 1rem;
  display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
}
header b { font-size: 1.05rem; }
/* Tab pills form one horizontally scrollable strip so the header stays
 * on a single row on narrow screens (live badge + gear stay put). */
.nav-tabs {
  display: flex; gap: .6rem; align-items: center;
  min-width: 0; overflow-x: auto; white-space: nowrap;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tabs a { flex: 0 0 auto; }
@media (max-width: 600px) {
  header { flex-wrap: nowrap; }
  header > * { flex-shrink: 0; }
  header > .nav-tabs { flex-shrink: 1; }
}
header a, header button.hdr {
  color: var(--color-fg-muted);
  background: transparent;
  text-decoration: none;
  padding: .15rem .55rem;
  border: 1px solid var(--color-border-line);
  border-radius: 999px;
  font-size: .85rem;
  cursor: pointer;
}
header a.on { color: var(--color-bg); background: var(--color-ok); border-color: var(--color-ok); }
header a:hover, header button.hdr:hover {
  color: var(--color-ok); border-color: var(--color-ok);
}
.spacer { flex: 1; }
.sse-status {
  font-size: .78rem; color: var(--color-fg-muted);
  padding: .1rem .5rem; border: 1px solid var(--color-border-line);
  border-radius: 999px;
}
.sse-status.live { color: var(--color-ok); border-color: var(--color-ok); }
.sse-status.off { color: var(--color-bad); border-color: var(--color-bad); }
/* Readable (narrow) is the default — ~62ch per line. "Wide" fills most
 * of the viewport for dense dashboards. Toggled from the gear menu
 * via <html data-width="wide|narrow">. The chat page gets a tighter
 * readable cap (56rem) and relaxes to a dashboard-ish width when the
 * user picks Wide. */
main { max-width: 62rem; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
html[data-width="wide"] main { max-width: min(1400px, 95vw); }
/* Issue #810: Schedules side panel. On desktop (>=1024px) it's a
 * fixed-position persistent panel on the right edge. On mobile it
 * collapses to an accordion slotted inside main (see .schedules-mobile
 * below). Width budget is 280px + small gutter so the main column at
 * `wide` setting still has room without running into the panel. */
@media (min-width: 1024px) {
  .schedules-panel {
    position: fixed;
    top: 4rem;
    right: 1rem;
    width: 280px;
    max-height: calc(100vh - 6rem);
    overflow-y: auto;
    border: 1px solid var(--color-border-line);
    border-radius: 8px;
    background: var(--color-bg);
    padding: .6rem .8rem;
    z-index: 5;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .schedules-mobile { display: none; }
}
@media (max-width: 1023px) {
  .schedules-panel { display: none; }
  .schedules-mobile { margin: 1.4rem 0 0; }
  .schedules-mobile > summary {
    cursor: pointer; font-weight: 600; color: var(--color-fg-muted);
    padding: .3rem 0; border-bottom: 1px solid var(--color-border-line);
  }
}
.schedules-panel h3 {
  margin: 0 0 .5rem; font-size: .95rem;
  border-bottom: 1px solid var(--color-border-line);
  padding-bottom: .3rem;
  display: flex; justify-content: space-between; align-items: baseline; gap: .4rem;
}
.schedules-panel .sched-empty, .schedules-mobile .sched-empty {
  color: var(--color-fg-muted); font-size: .85rem; font-style: italic;
}
.schedules-panel ul, .schedules-mobile ul { list-style: none; padding: 0; margin: 0; }
.schedules-panel li, .schedules-mobile li {
  padding: .4rem 0;
  border-bottom: 1px dashed var(--color-border-line);
  font-size: .85rem;
}
.schedules-panel li:last-child, .schedules-mobile li:last-child { border-bottom: none; }
.sched-id { font-weight: 600; font-family: var(--font-mono, ui-monospace, monospace); }
.sched-row { display: flex; justify-content: space-between; gap: .4rem; }
.sched-sched { color: var(--color-fg-muted); font-size: .8rem; }
.sched-desc {
  margin: .15rem 0 0;
  color: var(--color-fg-muted);
  font-size: .78rem;
  white-space: normal; word-break: break-word;
}
.sched-next { color: var(--color-ok); font-size: .8rem; font-variant-numeric: tabular-nums; }
.sched-next.sched-overdue { color: var(--color-warn); }
.sched-last { color: var(--color-fg-muted); font-size: .75rem; }
.sched-badge { font-size: .85rem; margin-right: .2rem; }
.sched-updated { color: var(--color-fg-muted); font-size: .72rem; font-weight: normal; }
main:has(.a2ui-chat-page) { max-width: 56rem; padding: 1rem 1rem 1.5rem; }
html[data-width="wide"] main:has(.a2ui-chat-page) { max-width: min(1200px, 95vw); }
/* Tighter main gutters on phones give the chat thread more horizontal
 * room for message bubbles (#805). */
@media (max-width: 600px) {
  main:has(.a2ui-chat-page) { padding: .5rem .5rem .75rem; }
}
h1 { font-size: 1.5rem; margin: .6rem 0; }
h2.sec-heading {
  font-size: 1.15rem; margin: 1.6rem 0 .5rem;
  padding-bottom: .25rem;
  border-bottom: 1px solid var(--color-border-line);
}
.sec { margin: 1rem 0; }
.tier { margin: 1.6rem 0 0; }
.tier-heading {
  font-size: 1.2rem; margin: 0 0 .4rem;
  padding-bottom: .25rem;
  border-bottom: 2px solid var(--color-border-line);
}
.tier-heading .tier-hint {
  font-size: .8rem; font-weight: 400; margin-left: .6rem;
  color: var(--color-fg-muted);
}
.tier-heading .tier-stamp {
  font-size: .75rem; font-weight: 400; margin-left: .6rem;
  color: var(--color-fg-muted);
}
.tier-heading .tier-stamp[data-fresh="amber"] { color: var(--color-warn); }
.tier-heading .tier-stamp[data-fresh="red"] { color: var(--color-alert, #c0392b); }
.age-pill { font-variant-numeric: tabular-nums; }
/* Issue #832 — pipeline row expand drawer. A ▸/▾ toggle in the leading
 * column opens a drawer row below with the item's transition tail. The
 * drawer cell spans the full table so the timeline FxTable can fit; the
 * surrounding row gets a subtle bg so the drawer reads as a sub-record
 * rather than a sibling row. */
.pipeline-row-toggle {
  background: transparent; border: none; cursor: pointer;
  padding: 0 .2em; color: var(--color-fg-muted);
  font-variant-numeric: tabular-nums;
}
.pipeline-row-toggle:hover { color: var(--color-ok); }
.pipeline-row-drawer > td {
  background: var(--color-bg-subtle, rgba(0,0,0,0.03));
  padding: .5rem .75rem !important;
}
.pipeline-row-drawer .fx-tbl { margin: 0; }
.pipeline-row-drawer p { margin: 0; color: var(--color-fg-muted); }
.pipeline-row-drawer .drawer-see-all {
  margin-top: .4rem; font-size: .85rem;
}
.item-history-page h1 { margin: .4rem 0 .2rem; }
.item-history-page .meta { color: var(--color-fg-muted); font-size: .9rem; margin: 0 0 1rem; }
.item-history-page .back { font-size: .85rem; }
.age-pill-warn, .age-pill-alert {
  padding: 0 .4em; border-radius: 4px; color: #fff; font-weight: 600;
}
.age-pill-warn { background: var(--color-warn); }
.age-pill-alert { background: var(--color-alert, #c0392b); }
.tier-top .tier-heading { border-bottom-color: var(--color-warn); }
.tier-aside > summary {
  cursor: pointer; font-weight: 600; color: var(--color-fg-muted);
  padding: .3rem 0; border-bottom: 1px solid var(--color-border-line);
}
summary.fx-group-h { cursor: pointer; }
details.fx-group { margin-top: .9rem; }
details.fx-group:first-child { margin-top: 0; }
.sec-body del { color: var(--color-fg-muted); }
.sec-body a { color: var(--color-ok); }
.sec-body ul { padding-left: 1.2rem; }
.sec-body li { margin: .2rem 0; }
.sec-body code {
  background: var(--color-panel);
  border: 1px solid var(--color-border-line);
  border-radius: 4px; padding: 0 .3rem; font-size: .88em;
}
.notice {
  margin: 1rem 0; padding: .5rem .8rem;
  border: 1px solid var(--color-warn); border-radius: 6px;
  background: var(--color-panel); color: var(--color-warn);
}
.notice.err { border-color: var(--color-bad); color: var(--color-bad); }
.fx-big { display: inline-flex; align-items: baseline; gap: .3rem; }
.fx-big .n {
  font-size: var(--dash-font-size-title);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.fx-big .of { color: var(--color-fg-muted); font-size: var(--dash-font-size-caption); }
.a2ui-chat-thread { max-height: calc(100vh - 14rem); overflow-y: auto; overflow-anchor: none; padding-bottom: 3rem; }
@supports (height: 100dvh) {
  .a2ui-chat-thread { max-height: calc(100dvh - 14rem); }
}
@media (max-width: 600px) {
  /* On phones, the parent .a2ui-chat-page flex column (height: 100dvh -
     5rem) owns the layout: let the thread grow to fill remaining space
     via flex:1, and keep the composer sticky so a soft keyboard can
     still push it up without clipping (#711). The old max-height cap
     (22rem) over-reserved ~270 CSS px on an iPhone viewport and left a
     large dead band below the Send button. */
  .a2ui-chat-thread { max-height: none; min-height: 0; }
  .a2ui-composer {
    position: sticky;
    bottom: 0;
    z-index: 5;
    background: var(--color-bg);
    padding-bottom: calc(.4rem + env(safe-area-inset-bottom, 0px));
  }
}
.chat-loading-older {
  position: sticky;
  top: 0;
  height: 0;
  margin-bottom: calc(-1 * var(--dash-gap-xs, 0px));
  overflow: visible;
  text-align: center;
  z-index: 4;
  pointer-events: none;
}
.chat-loading-older span {
  display: inline-block;
  padding: .1rem .6rem;
  font-size: .78rem;
  color: var(--color-fg-muted);
  background: var(--color-panel);
  border-radius: 999px;
}
.a2ui-composer { display: flex; flex-direction: column; gap: .4rem; }
.a2ui-composer.dragging { outline: 2px dashed var(--color-ok); outline-offset: 2px; }
.a2ui-composer-bar { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.a2ui-composer-send { margin-left: auto; }
.a2ui-composer-send .a2ui-btn-row { margin: 0; }
.a2ui-attachments-preview {
  display: flex; flex-wrap: wrap; gap: .4rem;
  padding: .4rem .6rem;
  border: 1px solid var(--color-border-line);
  border-radius: 6px;
  background: var(--color-bg);
}
/* Settings gear + popover. The wrap is relative-positioned so the
 * absolute panel hangs off the button's right edge. */
.cfg-wrap { position: relative; display: inline-block; }
.cfg-gear {
  font-size: 1.1rem;
  line-height: 1;
  width: 2.4rem;
  height: 2.4rem;
  padding: 0;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.cfg-gear svg { width: 1.3rem; height: 1.3rem; display: block; }
.cfg-panel {
  position: absolute; right: 0; top: calc(100% + .35rem);
  min-width: 14rem;
  background: var(--color-bg);
  border: 1px solid var(--color-border-line);
  border-radius: 10px;
  padding: .6rem .75rem;
  display: flex; flex-direction: column; gap: .55rem;
  box-shadow: 0 6px 24px rgba(0,0,0,.14);
  z-index: 10;
}
.cfg-section { display: flex; flex-direction: column; gap: .3rem; }
.cfg-label { font-size: .75rem; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: .04em; }
.cfg-row { display: flex; flex-wrap: wrap; gap: .3rem; }
.cfg-pill {
  background: transparent;
  color: var(--color-fg-muted);
  border: 1px solid var(--color-border-line);
  border-radius: 999px;
  padding: .15rem .6rem;
  font-size: .82rem;
  cursor: pointer;
}
.cfg-pill:hover { color: var(--color-ok); border-color: var(--color-ok); }
.cfg-pill.on {
  color: var(--color-bg);
  background: var(--color-ok);
  border-color: var(--color-ok);
}
/* Keyboard shortcuts help modal (PR ux/overview-shortcuts-help). */
.kb-help-trigger {
  font-weight: 600;
  font-size: 1rem;
  width: 2rem;
  height: 2rem;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.kb-help-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, .35);
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}
.kb-help {
  background: var(--color-bg);
  color: var(--color-fg);
  border: 1px solid var(--color-border-line);
  border-radius: 12px;
  padding: 1.2rem 1.4rem;
  max-width: 32rem;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .28);
}
.kb-help h2 { margin: 0 0 .8rem; font-size: 1.2rem; }
.kb-help .kb-group { margin-top: 1rem; }
.kb-help .kb-group:first-of-type { margin-top: 0; }
.kb-help .kb-group h3 {
  font-size: .78rem; font-weight: 600;
  color: var(--color-fg-muted);
  text-transform: uppercase; letter-spacing: .04em;
  margin: 0 0 .4rem;
  padding-bottom: .2rem;
  border-bottom: 1px solid var(--color-border-line);
}
.kb-help ul { list-style: none; padding: 0; margin: 0; }
.kb-help li {
  display: flex; align-items: baseline; gap: .8rem;
  padding: .3rem 0;
}
.kb-help .kb-keys {
  min-width: 8rem;
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: .85rem;
}
.kb-help .kb-then { color: var(--color-fg-muted); margin: 0 .2rem; }
.kb-help kbd {
  background: var(--color-panel);
  border: 1px solid var(--color-border-line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 .4rem;
  font-family: inherit;
  font-size: .85rem;
}
.kb-help .kb-label { flex: 1; color: var(--color-fg); }
.kb-help-foot {
  margin: 1rem 0 0;
  font-size: .78rem;
  color: var(--color-fg-muted);
}
.kb-help-close {
  margin-top: .9rem;
  background: var(--color-ok);
  color: var(--color-bg);
  border: 1px solid var(--color-ok);
  border-radius: 999px;
  padding: .3rem 1rem;
  font-size: .9rem;
  cursor: pointer;
}
.kb-help-close:hover { opacity: .9; }
.chat-image { margin: .4rem 0; max-width: 100%; }
.chat-image img {
  max-width: 100%;
  max-height: 420px;
  border-radius: 6px;
  display: block;
  background: var(--color-bg);
}
.chat-file { margin: .2rem 0; color: var(--color-fg-muted); font-size: .9rem; }
.chat-jump {
  position: sticky;
  bottom: 1.5rem;
  margin-left: auto;
  margin-right: 1.5rem;
  margin-top: -3rem;
  padding: .45rem .9rem;
  font-size: .9rem;
  color: var(--color-bg);
  background: var(--color-fg-muted);
  border: 1px solid var(--color-fg-muted);
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  align-self: flex-end;
  z-index: 5;
}
.chat-jump:hover { background: var(--color-fg); border-color: var(--color-fg); }
.chat-jump.unread {
  background: var(--color-ok);
  border-color: var(--color-ok);
  animation: jumpPulse 1.8s ease-in-out infinite;
}
@keyframes jumpPulse { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-2px)} }
/* Message status pill — visible chip in the metadata footer rather
 * than tiny inline text. "sending" pulses, "sent" is muted grey check,
 * "delivered" is accent check that fades to muted after a moment so it
 * doesn't shout on old messages. */
.msg-status {
  display: inline-block;
  padding: 0 .4rem;
  margin-left: .25rem;
  font-size: .7rem;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  border-radius: 999px;
  border: 1px solid currentColor;
  line-height: 1.4;
}
.msg-status-sending {
  color: var(--color-warn, #b06f14);
  background: rgba(176, 111, 20, .1);
  animation: msgPulse 1s ease-in-out infinite;
}
.msg-status-sent {
  color: var(--color-fg-muted);
  background: rgba(127, 127, 127, .12);
}
.msg-status-delivered {
  color: var(--color-ok);
  background: rgba(46, 122, 79, .12);
  animation: msgDeliveredFade 3s ease-out forwards;
}
.msg-status-read {
  color: var(--color-accent, var(--color-ok));
  background: rgba(46, 122, 79, .12);
}
@keyframes msgPulse { 0%,100% {opacity:.55} 50% {opacity:1} }
@keyframes msgDeliveredFade {
  0% { color: var(--color-ok); opacity: 1; }
  70% { color: var(--color-ok); opacity: 1; }
  100% { color: var(--color-fg-muted); opacity: .55; background: transparent; }
}
/* Jason bubbles override the chip to show up on the green background */
.msg.jason .msg-status { color: #fff; background: rgba(0, 0, 0, .22); border-color: rgba(255, 255, 255, .5); }
.msg.jason .msg-status-sending { background: rgba(255, 180, 60, .32); color: #fff; border-color: #fff; }
.msg.jason .msg-status-delivered { background: rgba(255, 255, 255, .25); color: #fff; animation: none; }
.msg.jason .msg-status-read { background: rgba(255, 255, 255, .25); color: #fff; font-weight: 700; }
.a2ui-attach {
  cursor: pointer; font-size: .85rem; color: var(--color-fg-muted);
  padding: .15rem .55rem; border: 1px solid var(--color-border-line);
  border-radius: 999px;
}
.a2ui-attach:hover { color: var(--color-ok); border-color: var(--color-ok); }
.a2ui-attach input { display: none; }
.a2ui-attachment {
  display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem;
  padding: .1rem .4rem; border: 1px solid var(--color-border-line);
  border-radius: 6px; background: var(--color-panel);
}
.a2ui-attachment img { height: 28px; width: 28px; object-fit: cover; border-radius: 3px; }
.a2ui-attachment button {
  background: transparent; border: 0; cursor: pointer; color: var(--color-fg-muted);
}
.a2ui-attach-err { color: var(--color-bad); font-size: .8rem; }
.a2ui-reply-chip {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  padding: .25rem .6rem; font-size: .82rem; color: var(--color-fg-muted);
  border-left: 3px solid var(--color-ok); background: var(--color-bg);
  border-radius: 4px;
}
.a2ui-reply-chip button { background: transparent; border: 0; cursor: pointer; color: var(--color-fg-muted); }

/* Slice-2 (#881 follow-up): inline expand for Waiting-on-you entries.
 * Clicking a bold title in the hand-maintained zone expands the row
 * in place with timeline + Accept/Reject/Steer + reply. The expanded
 * block renders into a sibling ``<div class="woy-expand">`` placed
 * immediately after the clicked ``<li>`` so the surrounding list stays
 * visible above and below. No modal, no scrim. */
.woy-click strong { cursor: pointer; border-bottom: 1px dashed var(--color-fg-muted); }
.woy-click strong:hover { color: var(--color-ok); border-bottom-color: var(--color-ok); }
.woy-click li.woy-active > strong,
.woy-click li.woy-active > p > strong { color: var(--color-ok); border-bottom-color: var(--color-ok); }
.woy-needs-approval {
  margin: .25rem 0 .55rem 0;
  padding: .35rem .5rem .4rem .5rem;
  border-left: 3px solid var(--color-ok);
  background: var(--color-bg);
  border-radius: 4px;
}
.woy-needs-approval-head {
  margin: 0 0 .25rem 0;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--color-fg-muted);
}
.woy-needs-approval ul { list-style: none; margin: 0; padding: 0; }
.woy-needs-approval li {
  display: flex; gap: .55rem; align-items: center;
  margin: .2rem 0; padding: .05rem 0;
}
.woy-approval-label {
  flex: 1; font-size: .92rem; cursor: pointer;
  border-bottom: 1px dashed var(--color-fg-muted);
}
.woy-approval-label:hover { color: var(--color-ok); border-bottom-color: var(--color-ok); }
.woy-row-actions {
  display: inline-flex; gap: .3rem; margin-left: .55rem;
  vertical-align: middle;
}
.woy-row-actions button {
  background: transparent; color: var(--color-ok);
  border: 1px solid var(--color-ok); border-radius: 999px;
  padding: .05rem .55rem; font: inherit; font-size: .78rem;
  cursor: pointer; line-height: 1.25;
}
.woy-row-actions button.reject { color: var(--color-bad); border-color: var(--color-bad); }
.woy-row-actions button:hover { background: var(--color-panel); }

function ageStringSeconds(ageSec) {
  const s = Math.max(0, Math.floor(ageSec || 0));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const hr = Math.floor(m / 60);
  if (hr >= 24) return Math.floor(hr / 24) + "d";
  const rm = m % 60;
  return hr + "h" + (rm ? " " + rm + "m" : "");
}

// Re-tint freshness tiles every ~10s so an idle-but-stale panel drifts
// through ok → amber → red without needing a new SSE event.
function useNowTick(intervalMs) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), intervalMs || 10000);
    return () => clearInterval(id);
  }, [intervalMs]);
  return now;
}

// ── 7b. A2UI generic renderer (#651) ─────────────────────────────
// Walks the component tree the server describes as a flat adjacency
// list, resolves ``props.boundTo = "/path"`` against the surface's
// data model (RFC-6901 JSON pointer, keys only — no array-index
// support needed yet; the one place it'd help is inside the chat
// thread list which we already resolve manually). Unknown component
// types render as a visible ``<pre>`` dump so a schema drift is
// loud, not silent — same philosophy as _safe_render on the server.
function resolvePointer(data, pointer) {
  if (!pointer || pointer === "") return data;
  if (!pointer.startsWith("/")) return undefined;
  const parts = pointer.slice(1).split("/").map(s =>
    s.replace(/~1/g, "/").replace(/~0/g, "~"));
  let cur = data;
  for (const p of parts) {
    if (cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

// Replay an A2UI envelope list into a plain ``{components, data}``
// snapshot. Every ``section.update`` for a page reruns this fresh —
// the server emits the full list each tick, so idempotent replay is
// the whole story. ``null`` surface means "nothing to render".
function replayA2ui(envelopes) {
  if (!Array.isArray(envelopes) || !envelopes.length) return null;
  let surfaceId = null;
  const components = new Map();
  let data = {};
  for (const env of envelopes) {
    if (!env || typeof env !== "object") continue;
    const sid = env.surfaceId;
    if (!sid) continue;
    if (env.type === "createSurface") {
      surfaceId = sid;
      components.clear();
      data = env.data ? {...env.data} : {};
      for (const c of (env.components || [])) {
        if (c && c.id) components.set(c.id, c);
      }
    } else if (env.type === "updateComponents") {
      for (const c of (env.components || [])) {
        if (c && c.id) components.set(c.id, c);
      }
    } else if (env.type === "updateDataModel") {
      applyDataModel(data, env.path || "", env.value);
    } else if (env.type === "deleteSurface") {
      if (surfaceId === sid) return null;
    }
  }
  if (!surfaceId || !components.has("root")) return null;
  return {surfaceId, components, data};
}

function applyDataModel(data, pointer, value) {
  if (!pointer || pointer === "") {
    // Whole-document replace: mutate the caller's object in place so
    // the ``data`` reference held by replayA2ui stays consistent.
    for (const k of Object.keys(data)) delete data[k];
    if (value && typeof value === "object" && !Array.isArray(value)) {
      Object.assign(data, value);
    }
    return;
  }
  if (!pointer.startsWith("/")) return;
  const parts = pointer.slice(1).split("/").map(s =>
    s.replace(/~1/g, "/").replace(/~0/g, "~"));
  const last = parts.pop();
  let cur = data;
  for (const p of parts) {
    if (cur[p] == null || typeof cur[p] !== "object") cur[p] = {};
    cur = cur[p];
  }
  cur[last] = value;
}

// Post helper for button actions. ``kind`` is the semantic action
// string from the button's props (chat.send / review.approve / …);
// the switch maps each to the existing POST endpoint + payload shape
// so ``handle_chat`` / ``handle_review_action`` on the server stay
// untouched — A2UI only describes the UI around them.
async function dispatchA2uiAction(kind, {text, slug, files, replyTo, reportId}) {
  if (!KEY) return {ok: false, error: "no key"};
  if (kind === "chat.send") {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        key: KEY, text,
        files: (files || []).map(f => ({name: f.name, data: f.data})),
        ...(replyTo ? {reply_to: replyTo} : {}),
      }),
    });
    const j = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, error: j.error};
  }
  if (kind === "review.approve" || kind === "review.modify" || kind === "review.reject") {
    const action = kind.slice("review.".length);
    const r = await fetch("/api/review-action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, slug, action, notes: text || ""}),
    });
    const j = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, error: j.error};
  }
  if (kind === "bug.approve" || kind === "bug.deny") {
    // "Deny" in the UI maps to the backend verb ``reject`` so the
    // dropped surface type (``status-bug-reject``) matches the SM
    // vocabulary the rest of the codebase uses.
    const action = kind === "bug.approve" ? "approve" : "reject";
    const r = await fetch("/api/bug-action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, report_id: reportId, action, notes: text || ""}),
    });
    const j = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, error: j.error};
  }
  if (kind === "bug.chat") {
    // Pure client-side: jump to the Chat tab with the composer
    // pre-seeded to ``bug-<N>: `` so Jason can just type what he
    // wants to say about this specific bug. Reuses the existing
    // ``chatReplyStore`` wiring that the Chat tab's composer
    // subscribes to (same hook message replies use), so no new
    // server endpoint or store is needed.
    try {
      chatReplyStore.request({at: "", quote: "bug-" + reportId + ": ", preview: "bug-" + reportId});
    } catch (_e) { /* store not yet live — fall through to nav */ }
    if (location.hash !== "#chat") location.hash = "#chat";
    return {ok: true};
  }
  return {ok: false, error: "unknown action: " + kind};
}

// Walker: render one component by id, resolving list children and
// data-model references as it goes. The React key is the component
// id — the server picks stable ids per surface. ``local`` is the
// per-surface in-component state (textarea values keyed by id,
// per-button send-status text) owned by ``A2uiSurface``.
function renderA2uiComponent(id, surface, local, setLocal) {
  const c = surface.components.get(id);
  if (!c) return null;
  const type = c.type || "";
  const props = c.props || {};
  const children = c.children || [];
  switch (type) {
    case "text": {
      const md = props.markdown || props.text || "";
      return h("div", {
        key: id,
        className: "a2ui-text" + (props.variant ? " " + props.variant.replace(/[^a-z0-9- ]/gi, "") : ""),
        dangerouslySetInnerHTML: {__html: renderMarkdown(String(md))},
      });
    }
    case "pill": {
      const bound = props.boundTo ? resolvePointer(surface.data, props.boundTo) : null;
      if (bound == null) return null;
      // Pill payloads are either a string, or a struct the client
      // flattens ("$0.10 est / $0.15 actual · Δ $0.05" for pricing).
      let label;
      if (typeof bound === "string") {
        label = bound;
      } else if (bound && typeof bound === "object") {
        const parts = [];
        if (bound.estimate) parts.push(bound.estimate + " est");
        if (bound.actual) parts.push(bound.actual + " actual");
        if (bound.delta) parts.push((bound.count ? "over by " : "Δ ") + bound.delta);
        label = parts.join(" / ") || JSON.stringify(bound);
        if (bound.count) label = "Total dispatch cost across " + bound.count + " bugs: " + label;
      } else {
        label = String(bound);
      }
      return h("span", {key: id, className: "fx-pill a2ui-pill", style: bound && bound.overrun ? {color: "#b45309", borderColor: "#f59e0b"} : undefined}, label);
    }
    case "textarea": {
      const current = local.textareas[id] ?? "";
      const submitBtn = props.submitId ? surface.components.get(props.submitId) : null;
      const withFiles = !!props.attachments;
      const pending = (local.attachments && local.attachments[id]) || [];
      const attachErr = (local.attachErr && local.attachErr[id]) || "";
      const ta = h("textarea", {
        className: "a2ui-textarea",
        placeholder: props.placeholder || "",
        "aria-label": props.ariaLabel || props.placeholder || "Message Alice",
        autoCorrect: "off",
        autoCapitalize: "off",
        spellCheck: false,
        value: current,
        ref: el => {
          if (!el) return;
          el.style.height = "auto";
          el.style.height = el.scrollHeight + 2 + "px";
        },
        onChange: e => setLocal(s => ({
          ...s,
          textareas: {...s.textareas, [id]: e.target.value},
        })),
        onKeyDown: submitBtn ? (e => {
          if (!shouldSubmitOnKey(e)) return;
          e.preventDefault();
          runA2uiAction(props.submitId, submitBtn.props || {}, surface, local, setLocal);
        }) : undefined,
        onPaste: withFiles ? (e => {
          const imgs = imageFilesFromClipboard(e.clipboardData);
          if (!imgs.length) return;
          e.preventDefault();
          addA2uiFiles(id, imgs, local, setLocal);
        }) : undefined,
      });
      if (!withFiles) return h(React.Fragment, {key: id}, ta);
      const dragging = !!(local.dragging && local.dragging[id]);
      const setDragging = v => setLocal(s => ({...s, dragging: {...s.dragging, [id]: v}}));
      return h("div", {
        key: id,
        className: "a2ui-composer" + (dragging ? " dragging" : ""),
        onDragOver: e => { e.preventDefault(); if (!dragging) setDragging(true); },
        onDragLeave: () => setDragging(false),
        onDrop: e => {
          e.preventDefault();
          setDragging(false);
          addA2uiFiles(id, Array.from(e.dataTransfer.files || []), local, setLocal);
        },
      },
        local.replyTo ? h("div", {className: "a2ui-reply-chip", "data-testid": "reply-chip"},
          h("span", null, "↩︎ Replying to: " + (local.replyTo.preview || "message")),
          h("button", {
            type: "button", "aria-label": "Cancel reply",
            onClick: () => setLocal(s => ({...s, replyTo: null})),
          }, "×"),
        ) : null,
        // Pending attachments preview — renders ABOVE the textarea, inline
        // with Teams/Slack/Discord convention per Jason 2026-11-06 11:44.
        pending.length ? h("div", {className: "a2ui-attachments-preview"},
          pending.map((f, i) => h("span", {key: f.name + "-" + i, className: "a2ui-attachment"},
            f.type.startsWith("image/")
              ? h("img", {alt: "", src: "data:" + f.type + ";base64," + f.data})
              : null,
            f.name,
            h("button", {
              type: "button", "aria-label": "Remove " + f.name,
              onClick: () => setLocal(s => ({
                ...s,
                attachments: {...s.attachments, [id]: (s.attachments[id] || []).filter((_, j) => j !== i)},
              })),
            }, "×"),
          )),
        ) : null,
        ta,
        h("div", {className: "a2ui-composer-bar"},
          h("label", {className: "a2ui-attach"},
            "📎 Attach",
            h("input", {
              type: "file", multiple: true, accept: ACCEPT,
              "data-testid": "chat-file-input",
              onChange: e => {
                addA2uiFiles(id, Array.from(e.target.files || []), local, setLocal);
                e.target.value = "";
              },
            }),
          ),
          attachErr ? h("span", {className: "a2ui-attach-err"}, attachErr) : null,
          // Render the submit button inline on the right of the attach row
          // when the textarea declares a submitId. Keeps Send + Attach on
          // one line per Jason 2026-11-06 — the button is still a normal
          // top-level a2ui component so it can be omitted from the root
          // children list without losing its click handler.
          submitBtn ? h("div", {className: "a2ui-composer-send"},
            renderA2uiComponent(props.submitId, surface, local, setLocal)) : null,
        ),
      );
    }
    case "button": {
      const status = local.statuses[id] || "";
      const disabled = local.pending[id] || !KEY;
      const variant = props.variant ? " a2ui-btn-" + String(props.variant).replace(/[^a-z0-9-]/gi, "") : "";
      return h("div", {key: id, className: "a2ui-btn-row"},
        h("button", {
          className: "a2ui-btn" + variant,
          disabled,
          onClick: () => runA2uiAction(id, props, surface, local, setLocal),
        }, props.label || "Submit"),
        status ? h("span", {className: "sse-status" + (status.startsWith("Error") ? " off" : "")}, status) : null,
      );
    }
    case "list": {
      // Lists have two flavours:
      //   1. plain children — render each child component
      //   2. boundTo → the data at that pointer is a list of row
      //      objects (variant = "chat-thread" / "bugs-sections" / …)
      if (props.boundTo) {
        const rows = resolvePointer(surface.data, props.boundTo);
        if (props.variant === "chat-thread") {
          return h(ChatThread, {key: id, rows: rows || []});
        }
        return h("div", {key: id, className: "a2ui-list a2ui-" + (props.variant || "boundlist")},
          renderBoundList(id, props, rows || []));
      }
      const heading = props.heading;
      return h("div", {key: id, className: "a2ui-list a2ui-" + (props.variant || "list")},
        heading ? h("h3", null, heading) : null,
        children.map(cid => renderA2uiComponent(cid, surface, local, setLocal)),
      );
    }
    default:
      return h("pre", {
        key: id,
        className: "a2ui-unknown",
        style: {whiteSpace: "pre-wrap"},
      }, "unknown a2ui component: " + JSON.stringify(c));
  }
}

// Reply requests (#668): a message's "↩︎ Reply" button emits
// ``{at, quote, preview}``; the chat A2uiSurface owns the composer state
// and subscribes to fill the textarea.
const chatReplyStore = {
  listeners: new Set(),
  request(req) { for (const fn of this.listeners) fn(req); },
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
};

// Locally-known reactions per message ``at`` (#668), shown the moment a
// POST /api/chat/react returns, until the SSE tick carries the same
// state (or ~6 s pass — the server wins after that).
const OVERRIDE_TTL_MS = 6000;
const chatReactionStore = {
  overrides: {},
  listeners: new Set(),
  set(at, reactions) {
    this.overrides = {...this.overrides, [at]: {reactions, ts: Date.now()}};
    this._emit();
  },
  reconcile(rows) {
    const bySig = {};
    for (const m of rows) if (m.at) bySig[m.at] = reactionsSignature(m.reactions);
    const kept = {};
    for (const [at, o] of Object.entries(this.overrides)) {
      const fresh = Date.now() - o.ts < OVERRIDE_TTL_MS;
      if (fresh && bySig[at] !== reactionsSignature(o.reactions)) kept[at] = o;
    }
    if (Object.keys(kept).length !== Object.keys(this.overrides).length) {
      this.overrides = kept;
      this._emit();
    }
  },
  _emit() { for (const fn of this.listeners) fn(this.overrides); },
  subscribe(fn) {
    this.listeners.add(fn);
    fn(this.overrides);
    return () => this.listeners.delete(fn);
  },
};

async function postReaction(at, emoji, action) {
  if (!KEY) return;
  try {
    const r = await fetch("/api/chat/react", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, at, emoji, action}),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.reactions) chatReactionStore.set(at, j.reactions);
  } catch (_) { /* the next tick shows the server's truth */ }
}

// Scroll a message into the middle of the thread and flash it (#668).
//
// Image loads can push the target up/down AFTER the initial scrollIntoView,
// leaving the viewport near-but-not-on the target — Jason 2026-11-06 12:55
// EST: "The links to specific messages don't take me to that specific
// message. Maybe the img height is not accounted for?"
//
// Fix: observe the thread's children with a ResizeObserver and re-center
// the target on every reflow for a short window (2s). Also pin to image
// load events on the target itself and its preceding siblings — those are
// the images that can shift the target downward as they decode. The whole
// thing bails out on a manual scroll or on the 2s budget, whichever
// comes first.
function jumpToMessage(at) {
  const el = document.getElementById(messageAnchorId(at));
  if (!el) return false;
  // Initial scroll.
  el.scrollIntoView({block: "center"});
  el.classList.remove("highlight");
  void el.offsetWidth;
  el.classList.add("highlight");
  setTimeout(() => el.classList.remove("highlight"), HIGHLIGHT_MS + 100);

  // Re-anchor across image/working-group reflows.
  const thread = el.closest(".a2ui-chat-thread");
  if (!thread) return true;
  const recenter = () => el.scrollIntoView({block: "center"});
  let ro = null;
  try {
    ro = new ResizeObserver(recenter);
    for (const child of Array.from(thread.children)) ro.observe(child);
  } catch (_) { /* ResizeObserver unavailable — initial scroll is best-effort */ }
  // Re-center as images that precede the target finish decoding.
  const imgsBefore = [];
  for (const sib of Array.from(thread.children)) {
    if (sib === el) break;
    sib.querySelectorAll && imgsBefore.push(...sib.querySelectorAll("img"));
  }
  imgsBefore.push(...el.querySelectorAll("img"));
  const onLoad = () => recenter();
  for (const img of imgsBefore) {
    if (!img.complete) img.addEventListener("load", onLoad, {once: true});
  }
  // Bail out on manual scroll so we don't fight the user.
  let cancelled = false;
  const cancel = () => { cancelled = true; };
  thread.addEventListener("wheel", cancel, {once: true, passive: true});
  thread.addEventListener("touchmove", cancel, {once: true, passive: true});
  // Hard timeout.
  setTimeout(() => {
    if (ro) ro.disconnect();
    for (const img of imgsBefore) img.removeEventListener("load", onLoad);
  }, 2000);
  return true;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

// Sticky-to-bottom message list: starts pinned to the latest message,
// follows new messages while the user is within ~40px of the bottom,
// and leaves the scroll position alone once they scroll up. A
// ``#msg-<at>`` hash (#668) scrolls that message into view once it
// renders, and un-sticks the list so new ticks don't yank it away.
function ChatThread({rows}) {
  const ref = useRef(null);
  const stick = useRef(true);
  const prevCount = useRef(0);
  const jumped = useRef("");
  const [pending, setPending] = useState(() => chatPendingStore.pending);
  // atBottom drives whether the "Jump" button renders; hasUnread flips
  // its label from "To latest" to "To new message" when traffic lands
  // while the user is scrolled away.
  const [atBottom, setAtBottom] = useState(true);
  const [hasUnread, setHasUnread] = useState(false);
  useEffect(() => chatPendingStore.subscribe(setPending), []);
  useEffect(() => { chatPendingStore.reconcile(rows); }, [rows]);
  const [overrides, setOverrides] = useState(() => chatReactionStore.overrides);
  useEffect(() => chatReactionStore.subscribe(setOverrides), []);
  useEffect(() => { chatReactionStore.reconcile(rows); }, [rows]);
  const [hashAt, setHashAt] = useState(() => parseMessageHash(location.hash));
  useEffect(() => {
    const on = () => {
      jumped.current = "";
      setHashAt(parseMessageHash(location.hash));
    };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  // Infinite scroll (#671): the SSE snapshot only carries the recent
  // tail, so every row ever seen (snapshots + fetched older pages) is
  // accumulated here and survives the tail window sliding forward.
  const known = useRef(new Map());
  const loadingRef = useRef(false);
  const exhausted = useRef(false);
  const failed = useRef(false);
  const anchor = useRef(null);
  const [loadingOlder, setLoadingOlder] = useState(false);
  const [, bump] = useState(0);
  // Working-groups come only from the latest snapshot (their state
  // changes in place and old ones fall out of the window).
  for (const k of Array.from(known.current.keys())) {
    if (k.startsWith("wg:")) known.current.delete(k);
  }
  for (const r of rows) known.current.set(chatRowKey(r), r);
  const allRows = Array.from(known.current.values());
  const serverRows = pending.length
    ? allRows.filter(r => !serverRowMatchesPending(r, pending))
    : allRows;
  const atEpoch = m => { const t = Date.parse(m.at || ""); return Number.isNaN(t) ? 0 : t; };
  const merged = [...serverRows, ...pending].sort((a, b) => atEpoch(a) - atEpoch(b));
  const last = merged.length ? merged[merged.length - 1] : null;
  const lastKey = last ? (last._client_id || chatRowKey(last)) : "";
  const prevLastKey = useRef("");
  const canLoadOlder = () =>
    !loadingRef.current && !exhausted.current &&
    allRows.filter(r => r.variant !== "working-group").length >= CHAT_PAGE_SIZE;
  const loadOlder = async () => {
    const before = earliestAt(Array.from(known.current.values()));
    if (!before || loadingRef.current || exhausted.current) return;
    loadingRef.current = true;
    failed.current = false;
    setLoadingOlder(true);
    try {
      const r = await fetch(
        "/api/chat?before=" + encodeURIComponent(before) + "&limit=" + CHAT_PAGE_SIZE);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const older = Array.isArray(j.messages) ? j.messages : [];
      const el = ref.current;
      if (el) anchor.current = {height: el.scrollHeight, top: el.scrollTop};
      for (const m of older) known.current.set(chatRowKey(m), m);
      if (older.length < CHAT_PAGE_SIZE) exhausted.current = true;
    } catch (_) {
      failed.current = true;
    } finally {
      loadingRef.current = false;
      setLoadingOlder(false);
      bump(n => n + 1);
    }
  };
  // Keep the visible message pinned after older rows are prepended:
  // the content above grew by (scrollHeight delta), so shift scrollTop
  // by the same amount before paint.
  useLayoutEffect(() => {
    const el = ref.current;
    const a = anchor.current;
    if (!el || !a) return;
    anchor.current = null;
    el.scrollTop = a.top + (el.scrollHeight - a.height);
  });
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Mark new-unread only when the newest message changed (a tail
    // arrival, not an older page prepended) AND the user is scrolled
    // away from the bottom. Growth at the bottom with stick=true is
    // already auto-followed below.
    const grew = merged.length > prevCount.current && lastKey !== prevLastKey.current;
    prevCount.current = merged.length;
    prevLastKey.current = lastKey;
    const scroll = () => { if (stick.current) el.scrollTop = el.scrollHeight; };
    scroll();
    const ro = new ResizeObserver(scroll);
    for (const child of Array.from(el.children)) ro.observe(child);
    const raf = requestAnimationFrame(scroll);
    if (grew && !stick.current) setHasUnread(true);
    return () => { ro.disconnect(); cancelAnimationFrame(raf); };
  }, [merged.length, last && last.at, last && last.step_count]);
  // Short threads (e.g. a tall window) never scroll, so scrolling can't
  // trigger the fetch: keep pulling older pages until the thread overflows.
  useEffect(() => {
    const el = ref.current;
    if (el && !failed.current && isNearTop(el) && canLoadOlder()) loadOlder();
  }, [merged.length, loadingOlder]);
  const jumpToLatest = () => {
    const el = ref.current;
    if (!el) return;
    el.scrollTop = el.scrollHeight;
    stick.current = true;
    setAtBottom(true);
    setHasUnread(false);
  };
  const onScroll = e => {
    const nearBottom = isNearBottom(e.currentTarget);
    stick.current = nearBottom;
    setAtBottom(nearBottom);
    if (nearBottom) setHasUnread(false);
    if (isNearTop(e.currentTarget) && canLoadOlder()) loadOlder();
  };
  useEffect(() => {
    if (!hashAt || jumped.current === hashAt) return;
    if (jumpToMessage(hashAt)) {
      jumped.current = hashAt;
      stick.current = false;
      setAtBottom(false);
    } else if (!failed.current && canLoadOlder()) {
      // Permalink target predates the loaded window: page older history
      // until it renders (each page re-fires this effect).
      loadOlder();
    }
  }, [hashAt, merged.length, loadingOlder]);
  return h(React.Fragment, null,
    h("div", {
      ref,
      className: "a2ui-list a2ui-chat-thread",
      role: "log",
      "aria-live": "polite",
      "aria-label": "Chat transcript",
      onScroll,
    },
      loadingOlder ? h("div", {
        key: "loading-older",
        className: "chat-loading-older",
        "data-testid": "chat-loading-older",
      }, h("span", null, "loading older…")) : null,
      renderChatMessages(merged, overrides)),
    !atBottom ? h("button", {
      className: "chat-jump" + (hasUnread ? " unread" : ""),
      onClick: jumpToLatest,
    }, hasUnread ? "↓ To new message" : "↓ To latest") : null,
  );
}

const IMAGE_RE = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i;
function renderChatMessages(rows, overrides) {
  if (!rows.length) {
    return h("div", {className: "typing"}, "No messages yet. Say hi.");
  }
  const byAt = {};
  for (const m of rows) if (m.at && !m.variant) byAt[m.at] = m;
  // Keys must not depend on list position: older pages are prepended and
  // an index key would remount (and reload images of) every bubble.
  const keyCounts = new Map();
  return rows.map((m, i) => {
    const baseKey = (m._client_id || m.at || "") + "|" + (m.from || "");
    const dup = keyCounts.get(baseKey) || 0;
    keyCounts.set(baseKey, dup + 1);
    if (m.variant === "working-group") {
      return h(WorkingGroup, {key: "wg-" + (m.turn_id || i), group: m});
    }
    const reactions = (overrides && m.at && overrides[m.at])
      ? overrides[m.at].reactions : m.reactions;
    return h(ChatMessage, {
      key: baseKey + "-" + dup,
      m, reactions, quoted: m.reply_to ? byAt[m.reply_to] : null,
    });
  });
}

// Single formatter for chat timestamps: time-only for today, date + time
// otherwise; full ISO kept in title and <time datetime>.
function chatTime(at) {
  if (!at) return null;
  const d = new Date(at);
  if (Number.isNaN(d.getTime())) return at;
  const sameDay = d.toDateString() === new Date().toDateString();
  const label = sameDay
    ? d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})
    : d.toLocaleDateString([], {month: "short", day: "numeric"}) + ", " +
      d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return h("time", {dateTime: d.toISOString(), title: at}, label);
}

function ChatMessage({m, reactions, quoted}) {
  const [picker, setPicker] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showQuoted, setShowQuoted] = useState(false);
  // Replies from Jason's client both set `reply_to` AND prepend the
  // quoted original as `> `-prefixed lines in the body. Peel that
  // leading block off so the renderer can collapse it behind a toggle
  // and lead with the new content; standalone markdown blockquotes
  // (no `reply_to`) still render verbatim.
  const splitBody = m.reply_to && m.text ? stripLeadingQuoteBlock(m.text) : null;
  const quotedRaw = splitBody && splitBody.quoted !== null ? splitBody.quoted : null;
  const bodyText = quotedRaw !== null ? splitBody.rest : m.text;
  // Prefer the richer `attachments` shape (name, url) over the
  // legacy `files` name-only shape so historical messages still
  // render with a filename if the url isn't present.
  const atts = (m.attachments && m.attachments.length)
    ? m.attachments
    : (m.files || []).map(n => ({name: n}));
  const actionable = !!m.at && (!m._optimistic || m.status === "delivered");
  // Per-bubble status indicator for Jason's optimistic messages.
  // sending — in-flight; sent — single check; delivered — accent check.
  // Server rows (historical reload) have no status and get no indicator.
  let statusIcon = null;
  if (m.from === "jason" && m.status) {
    const icons = {sending: "◌ sending", sent: "✓ sent", delivered: "✓ delivered", read: "✓✓ read"};
    statusIcon = h("span", {className: "msg-status msg-status-" + m.status}, icons[m.status] || m.status);
  }
  const summary = summarizeReactions(reactions);
  const mine = new Set(summary.filter(r => r.mine).map(r => r.emoji));
  const react = emoji => {
    setPicker(false);
    postReaction(m.at, emoji, mine.has(emoji) ? "remove" : "add");
  };
  const btn = (testid, label, title, onClick, extra) => h("button", {
    type: "button", className: "msg-action", title, "aria-label": title,
    "data-testid": testid, onClick, ...extra,
  }, label);
  return h("div", {
    id: actionable ? messageAnchorId(m.at) : undefined,
    "data-at": m.at || undefined,
    className: "msg " + (m.from === "jason" ? "jason" : "alice") + (m.status ? " status-" + m.status : ""),
  },
    actionable ? h("div", {className: "msg-actions", "data-testid": "msg-actions"},
      QUICK_REACTS.map(e => btn("react-btn", e, "React " + e, () => react(e),
        {key: e, "data-emoji": e, className: "msg-action" + (mine.has(e) ? " mine" : "")})),
      btn("react-more", "+", "More reactions", () => setPicker(p => !p), {key: "more"}),
      btn("reply-btn", "↩︎ Reply", "Reply", () => chatReplyStore.request({
        at: m.at, quote: quoteForReply(m), preview: replyPreview(m),
      }), {key: "reply"}),
      btn("copy-link-btn", copied ? "✓ Copied" : "🔗 Copy link", "Copy link", async () => {
        if (await copyText(permalinkFor(location.origin, m.at))) {
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        }
      }, {key: "link"}),
      picker ? h("div", {className: "msg-picker", key: "picker", "data-testid": "react-picker"},
        MORE_REACTS.map(e => btn("react-btn", e, "React " + e, () => react(e),
          {key: e, "data-emoji": e}))) : null,
    ) : null,
    m.reply_to ? h("button", {
      type: "button", className: "msg-reply-ref", "data-testid": "reply-ref",
      title: "Jump to the quoted message",
      onClick: () => {
        // Push the hash so the jump is also a bookmarkable permalink
        // (Jason explicitly asked for "a link to that other message").
        if (location.hash !== "#msg-" + m.reply_to) {
          history.pushState(null, "", location.pathname + location.search + "#msg-" + m.reply_to);
        }
        jumpToMessage(m.reply_to);
      },
    }, "In reply to: " + ((quoted && replyPreview(quoted)) || "an earlier message")) : null,
    quotedRaw !== null ? h("button", {
      type: "button", className: "msg-quote-toggle", "data-testid": "quote-toggle",
      "aria-expanded": showQuoted ? "true" : "false",
      onClick: () => setShowQuoted(v => !v),
    }, showQuoted ? "▾ Hide quoted" : "▸ Show quoted") : null,
    quotedRaw !== null && showQuoted
      ? h("pre", {className: "msg-quoted-raw", "data-testid": "quoted-raw"}, quotedRaw)
      : null,
    bodyText ? h("span", {dangerouslySetInnerHTML: {__html: chatTextToHtml(bodyText)}}) : null,
    ...atts.map((a, j) => {
      const name = a.name || "";
      const url = a.url;
      const isImage = url && IMAGE_RE.test(name);
      if (isImage) {
        const src = url + (url.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY || "");
        return h("div", {key: "f-" + j, className: "chat-image"},
          h("img", {src, alt: name, loading: "lazy"}));
      }
      return h("div", {key: "f-" + j, className: "chat-file"}, "📎 " + name);
    }),
    summary.length ? h("div", {className: "msg-reactions"},
      summary.map(r => h("button", {
        key: r.emoji, type: "button", "data-testid": "react-pill",
        className: "msg-react-pill" + (r.mine ? " mine" : ""),
        title: r.mine ? "Remove your reaction" : "React too",
        onClick: () => react(r.emoji),
      }, r.emoji + " " + r.count))) : null,
    h("small", null,
      (m.from === "jason" ? "You" : "Alice") + " · ",
      chatTime(m.at),
      statusIcon ? " · " : null,
      statusIcon,
    ),
  );
}

// Per-turn working-status group (#656): "Alice is working…" plus one
// muted row per significant tool call. Open while the turn is active,
// auto-collapses when it ends; clicking the summary pins the user's
// choice for the rest of the page's life.
function WorkingGroup({group}) {
  const [pinned, setPinned] = useState(null);
  const open = pinned === null ? !!group.active : pinned;
  const n = group.step_count || 0;
  const count = n + (n === 1 ? " step" : " steps");
  return h("details", {
    className: "working-group" + (group.active ? " active" : ""),
    "data-testid": "working-group",
    "data-turn-id": group.turn_id,
    open,
  },
    h("summary", {
      onClick: e => { e.preventDefault(); setPinned(!open); },
    }, (group.text || "") + " · " + count),
    h("ul", {className: "wg-steps"},
      (group.steps || []).map(st => h("li", {
        key: st.id,
        className: "wg-step " + (st.state || "done"),
        "data-testid": "working-step",
      }, st.label)),
    ),
    h("small", null, "Alice · ", chatTime(group.at)),
  );
}

// Read files into the composer's pending-attachment list for textarea ``id``.
async function addA2uiFiles(id, files, local, setLocal) {
  let count = ((local.attachments && local.attachments[id]) || []).length;
  const added = [];
  let err = "";
  files.forEach((file, i) => {
    const bad = validateAttachment(file, count + added.length);
    if (bad) { err = bad; return; }
    added.push({file, name: attachmentName(file, i)});
  });
  const loaded = [];
  for (const {file, name} of added) {
    try {
      loaded.push({name, type: file.type || "", data: await readAsBase64(file)});
    } catch (_) {
      err = "Could not read " + name + ".";
    }
  }
  setLocal(s => ({
    ...s,
    attachments: {...s.attachments, [id]: [...((s.attachments && s.attachments[id]) || []), ...loaded]},
    attachErr: {...s.attachErr, [id]: err},
  }));
}

// Shared by the Send button's click and the textarea's Enter key.
// Optimistic chat — a sent message is shown locally the instant the
// POST returns, without waiting for the next SSE tick (the broadcaster
// re-renders on a ~2 s cadence, so without this Jason saw a 1-2 s
// delay). The ChatThread subscribes to this store and merges pending
// messages below the server rows; a dedupe filter drops any pending
// whose (text, files) matches a server row from Jason in the recent
// tail, so the local echo quietly vanishes when the server catches up.
// Single-message optimistic flow (fix for Jason 2026-11-06 11:52 EST):
// the sent message is always the pending bubble — never a separate
// server echo. Status transitions in place: "sending" immediately on
// click, "sent" when POST returns, "delivered" when the SSE snapshot
// confirms the server stored it. Server-side rows that match a
// pending row (by text + file count) are hidden from render so there
// is never a two-bubble flash during the SSE-tick window.
const chatPendingStore = {
  pending: [],
  listeners: new Set(),
  add(msg) {
    this.pending = [...this.pending, msg];
    this._emit();
    return msg;
  },
  setStatus(client_id, status) {
    this.pending = this.pending.map(p =>
      p._client_id === client_id ? {...p, status} : p);
    this._emit();
  },
  reconcile(serverRows) {
    // When the server echoes a pending message, upgrade its status
    // along the sending -> sent -> delivered -> read rung and inherit
    // the server's at / attachment URLs so inline images render. The
    // server row itself is hidden by serverRowMatchesPending in the
    // merge below. We DON'T early-return at "delivered" so that a
    // later server-side status upgrade (e.g. "read" after Alice
    // opens the surface) still propagates to the pending bubble.
    const rungs = {sending: 0, sent: 1, delivered: 2, read: 3};
    let changed = false;
    const tail = serverRows.slice(-20).filter(r => r.from === "jason");
    const next = this.pending.map(p => {
      if (p.status === "read") return p;
      const match = tail.find(r =>
        (r.text || "") === (p.text || "") &&
        ((r.files && r.files.length) || 0) === ((p.files && p.files.length) || 0),
      );
      if (!match) return p;
      const serverRung = rungs[match.status] ?? -1;
      const curRung = rungs[p.status] ?? -1;
      // Promote to "delivered" on the first echo even if the server
      // hasn't marked status yet; take the server's status when it
      // sits higher on the rung.
      const nextStatus = serverRung > curRung
        ? match.status
        : (curRung < rungs.delivered ? "delivered" : p.status);
      const nextAt = match.at || p.at;
      const nextAttachments = match.attachments || p.attachments;
      const nextFiles = match.files || p.files;
      if (
        nextStatus === p.status &&
        nextAt === p.at &&
        nextAttachments === p.attachments &&
        nextFiles === p.files
      ) {
        return p;
      }
      changed = true;
      return {
        ...p,
        status: nextStatus,
        at: nextAt,
        attachments: nextAttachments,
        files: nextFiles,
      };
    });
    if (changed) {
      this.pending = next;
      this._emit();
    }
  },
  _emit() { for (const fn of this.listeners) fn(this.pending); },
  subscribe(fn) {
    this.listeners.add(fn);
    fn(this.pending);
    return () => this.listeners.delete(fn);
  },
};

// A server row is a duplicate of one of our pending rows when they
// share from=jason, text, and file count. Hiding the server row keeps
// the pending bubble as the single rendered message with its own
// status transitions.
function serverRowMatchesPending(row, pending) {
  if (row.from !== "jason") return false;
  return pending.some(p =>
    (row.text || "") === (p.text || "") &&
    ((row.files && row.files.length) || 0) === ((p.files && p.files.length) || 0),
  );
}

async function runA2uiAction(id, props, surface, local, setLocal) {
  const action = props.action || "";
  const taId = props.textareaId || "";
  const text = taId ? (local.textareas[taId] ?? "") : "";
  const files = taId ? ((local.attachments && local.attachments[taId]) || []) : [];
  if (local.pending[id] || !KEY) return;
  if (action === "chat.send" && !text.trim() && !files.length) return;
  if (action === "review.modify" && !text.trim()) {
    setLocal(s => ({...s, statuses: {...s.statuses, [id]: "Say what to change first."}}));
    return;
  }
  if (action === "review.reject" && !confirm("Reject this plan?")) {
    return;
  }
  setLocal(s => ({
    ...s,
    pending: {...s.pending, [id]: true},
    statuses: {...s.statuses, [id]: ""},
  }));
  // Capture the composer state before awaiting the POST so the
  // optimistic bubble uses the text/files the user actually sent.
  const sentText = text;
  const replyTo = action === "chat.send" && local.replyTo ? local.replyTo.at : "";
  const sentFiles = files.map(f => ({name: f.name, type: f.type}));
  // Pre-flight pending row: appears instantly as "sending".
  let clientId = null;
  if (action === "chat.send") {
    clientId = "pending-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    chatPendingStore.add({
      _client_id: clientId,
      from: "jason",
      at: new Date().toISOString().replace("Z", "-0000"),
      text: sentText,
      files: sentFiles.map(f => f.name),
      attachments: sentFiles.map(f => ({name: f.name, type: f.type})),
      ...(replyTo ? {reply_to: replyTo} : {}),
      status: "sending",
      _optimistic: true,
    });
  }
  const res = await dispatchA2uiAction(action, {
    text,
    files,
    slug: surface.data && surface.data.slug,
    replyTo,
  });
  if (clientId) {
    if (res.ok) chatPendingStore.setStatus(clientId, "sent");
    // On POST failure the pending row stays at "sending"; it'll
    // disappear when the composer re-sends or the user reloads.
  }
  setLocal(s => {
    const next = {
      ...s,
      pending: {...s.pending, [id]: false},
      statuses: {...s.statuses, [id]: res.ok ? "" : ("Error: " + (res.error || res.status || "unknown"))},
    };
    if (res.ok && taId) {
      next.textareas = {...s.textareas, [taId]: ""};
      next.attachments = {...s.attachments, [taId]: []};
      next.attachErr = {...s.attachErr, [taId]: ""};
      next.replyTo = null;
    }
    return next;
  });
}

// Inline action strip (Approve / Deny / Chat) rendered on each
// ``waiting-on-review`` bug tile (#TBD). Lives inside ``renderBoundList``
// for the ``bugs-sections`` variant so the tile itself carries the
// buttons — Jason can act without leaving the Bugs page.
//
// Each descriptor is ``{key, label, action, variant, report_id}``
// shaped on the server (``sources.bugs._row_actions``). Click calls
// ``dispatchA2uiAction`` directly with the per-row ``reportId``, so
// we don't need to thread anything through the surface-level
// ``local``/``runA2uiAction`` state machine that powers Chat +
// per-item Review.
function BugTileActions({actions}) {
  const [busy, setBusy] = useState({});
  const [status, setStatus] = useState({});
  const onClick = async (a) => {
    if (busy[a.key]) return;
    let notes = "";
    // Deny needs a reason so Speaking has something concrete to
    // bounce back to the dispatcher; cancel aborts the whole thing.
    if (a.action === "bug.deny") {
      notes = window.prompt("Deny bug-" + a.report_id + " — why? (notes get posted on the PR)") || "";
      if (!notes.trim()) return;
    } else if (a.action === "bug.approve") {
      // Approve is one click; a confirm() would make Jason do 2 taps
      // on mobile, and the action is reversible by closing the merged
      // PR via Deny on the next tile state. Keep the UX tight.
    }
    setBusy(s => ({...s, [a.key]: true}));
    setStatus(s => ({...s, [a.key]: ""}));
    const res = await dispatchA2uiAction(a.action, {
      text: notes,
      reportId: a.report_id,
    });
    setBusy(s => ({...s, [a.key]: false}));
    setStatus(s => ({...s, [a.key]: res.ok
      ? (a.action === "bug.chat" ? "" : "sent")
      : ("Error: " + (res.error || res.status || "unknown"))}));
  };
  return h("div", {className: "a2ui-btn-row bug-tile-actions"},
    actions.map(a => {
      const variant = a.variant ? " a2ui-btn-" + String(a.variant).replace(/[^a-z0-9-]/gi, "") : "";
      const label = busy[a.key] ? "…" : a.label;
      const s = status[a.key] || "";
      return h(React.Fragment, {key: a.key},
        h("button", {
          className: "a2ui-btn" + variant,
          "data-testid": "bug-action-" + a.key + "-" + a.report_id,
          disabled: busy[a.key] || !KEY,
          onClick: () => onClick(a),
        }, label),
        s ? h("span", {className: "sse-status" + (s.startsWith("Error") ? " off" : "")}, s) : null,
      );
    }),
  );
}

// Render `[text](https://url)` inline markdown links as <a> elements.
function renderInlineLinks(s) {
  const out = [];
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
  let last = 0, m, i = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) out.push(s.slice(last, m.index));
    out.push(h("a", {key: "l" + i++, href: m[2], target: "_blank", rel: "noopener"}, m[1]));
    last = re.lastIndex;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}

function renderBoundList(id, props, rows) {
  const variant = props.variant || "";
  if (variant === "bugs-sections") {
    return rows.map(sec => !sec.rows.length
      ? h("section", {key: sec.key, className: "bugs-section bugs-section-empty"},
          h("p", {className: "typing", style: {margin: ".25rem 0"}}, sec.heading + " (0)"))
      : h("section", {key: sec.key, className: "bugs-section"},
      h("h2", null, sec.heading),
      sec.rows.length
        ? h("ul", null, sec.rows.map(r => h("li", {key: r.id, style: r.stale ? {borderLeft: "3px solid #d9a441", paddingLeft: ".4rem"} : null},
            h("strong", null, r.title),
            r.summary_bits && r.summary_bits.length
              ? h("em", null, ": ", ...renderInlineLinks(r.summary_bits.join(" — ")))
              : null,
            r.pricing ? h("span", {className: "fx-pill", style: {marginLeft: ".4rem"}}, r.pricing) : null,
            r.meta || r.pr_url
              ? h("div", {style: {opacity: .65, fontSize: ".85em"}},
                  r.stale ? "⚠ stale · " : null,
                  r.meta,
                  r.pr_url ? [r.meta ? " · " : "", h("a", {key: "pr", href: r.pr_url, target: "_blank", rel: "noopener"}, "PR")] : null)
              : null,
            // Inline Approve / Deny / Chat strip for waiting-on-review
            // rows. The server flags each row with a non-empty
            // ``actions`` list; other buckets omit it so no strip
            // renders on Open / Fixed / Won't-fix / etc.
            r.actions && r.actions.length
              ? h(BugTileActions, {key: "acts", actions: r.actions})
              : null,
          )))
        : h("p", {className: "typing"}, "(none yet)"),
    ));
  }
  // Fallback: dump each row as a <pre> so the drift is visible but
  // the whole surface doesn't go dark.
  return rows.map((r, i) => h("pre", {key: i}, JSON.stringify(r)));
}

function A2uiSurface({envelopes, surfaceId}) {
  // Local-only state: textareas and button pending/status. Replayed
  // from scratch each render so updateComponents never clobbers what
  // the user is typing (textarea ids are stable per surface).
  const [local, setLocal] = useState({textareas: {}, statuses: {}, pending: {}, attachments: {}, attachErr: {}, dragging: {}});
  const surface = React.useMemo(() => replayA2ui(envelopes), [envelopes]);
  // Reply requests from a message's action strip (#668): quote the
  // message into the surface's textarea and remember what it answers.
  useEffect(() => chatReplyStore.subscribe(req => {
    if (!surface || surface.surfaceId !== "chat") return;
    let taId = "";
    for (const [cid, c] of surface.components) if (c.type === "textarea") { taId = cid; break; }
    if (!taId) return;
    setLocal(s => {
      const existing = s.textareas[taId] || "";
      return {
        ...s,
        textareas: {...s.textareas, [taId]: req.quote + existing},
        replyTo: {at: req.at, preview: req.preview},
      };
    });
    setTimeout(() => {
      const ta = document.querySelector(".a2ui-composer textarea");
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 0);
  }), [surface]);
  if (!surface) {
    return h("div", {className: "notice"}, "Waiting for the " + surfaceId + " surface…");
  }
  return h("div", {className: "a2ui-surface a2ui-surface-" + surface.surfaceId},
    renderA2uiComponent("root", surface, local, setLocal),
  );
}
