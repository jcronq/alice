<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alice — status</title>
<!--
  Reactive status-site shell (#639, slice-1).

  Reads one long-lived SSE stream from /api/events and renders each
  Overview section as markdown (reusing the legacy marked.js). The
  very first SSE frame is a full snapshot; subsequent `section.update`
  frames patch one section's state. Lists are replaced whole — never
  patched — so the client never has to reconcile a gap.

  No build toolchain: React + ReactDOM come over an importmap from
  esm.sh. Non-Overview pages (?p=chat, ?p=bugs, …) are handled by the
  legacy shell at /legacy.html; the shell redirects there on mount
  for anything but ?p=index, so nav tabs + modal + reply flow + chat
  keep working through slice-1. Slices 2–6 will port those into the
  reactive tree.
-->
<style>
:root{
  --bg:#fbfaf7;--fg:#1f2328;--muted:#6b7280;--card:#fff;
  --line:#e5e2db;--accent:#2f6f5e;--warn:#b45309;--bad:#b23a3a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a;--fg:#e6e6e6;--muted:#9aa0a6;--card:#1d2024;
  --line:#2c3036;--accent:#6cc4a8;--warn:#f0a35e;--bad:#f5766a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;z-index:2}
header b{font-size:1.05rem}
header a{color:var(--muted);text-decoration:none;padding:.15rem .55rem;border:1px solid var(--line);border-radius:999px;font-size:.85rem}
header a:hover{color:var(--accent);border-color:var(--accent)}
.spacer{flex:1}
.sse-status{font-size:.78rem;color:var(--muted);padding:.1rem .5rem;border:1px solid var(--line);border-radius:999px}
.sse-status.live{color:var(--accent);border-color:var(--accent)}
.sse-status.fallback{color:var(--warn);border-color:var(--warn)}
.sse-status.off{color:var(--bad);border-color:var(--bad)}
main{max-width:860px;margin:0 auto;padding:1rem 1rem 4rem}
h1{font-size:1.5rem;margin:.6rem 0}
h2{font-size:1.15rem;margin:1.6rem 0 .5rem;padding-bottom:.25rem;border-bottom:1px solid var(--line)}
h3{font-size:1rem}
em.stale-footer{display:block;font-size:.78em;opacity:.65;margin-top:.1rem}
ul{padding-left:1.2rem}li{margin:.2rem 0}
code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 .3rem;font-size:.88em}
a{color:var(--accent)}
.sec-body del{color:var(--muted)}
.notice{margin:1rem 0;padding:.5rem .8rem;border:1px solid var(--warn);border-radius:6px;background:var(--card);color:var(--warn)}
.notice.err{border-color:var(--bad);color:var(--bad)}
</style>
</head><body>
<div id="root">Loading Alice…</div>
<script src="marked.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
<script type="module">
import React, {useEffect, useReducer, useRef} from "react";
import {createRoot} from "react-dom/client";

// ── 0. key + legacy redirect ──────────────────────────────────────
// Key handling mirrors legacy.html: ?k=<key> → localStorage → bare URL.
const url = new URL(location.href);
const kParam = url.searchParams.get("k");
if (kParam) {
  localStorage.setItem("alice-key", kParam);
  url.searchParams.delete("k");
  history.replaceState(null, "", url.pathname + (url.search ? "?" + url.search : "") + url.hash);
}
const KEY = localStorage.getItem("alice-key") || "";
// Non-Overview pages continue to work through the legacy shell. The
// reactive widget library (slice-2+) will fold these into the tree.
const PAGE = (new URLSearchParams(location.search).get("p") || "index");
if (PAGE !== "index") {
  location.replace("legacy.html" + location.search + location.hash);
}

// ── 1. section catalogue ──────────────────────────────────────────
const SECTION_ORDER = [
  "running_now",
  "ready_for_review",
  "waiting_on_you",
  "alice_queue",
  "done_today",
  "known_issues",
];
const SECTION_LABELS = {
  running_now: "Running now",
  ready_for_review: "Ready for Review",
  waiting_on_you: "Waiting on you",
  alice_queue: "Alice's queue",
  done_today: "Done today",
  known_issues: "Known issues I'm on",
};

// ── 2. SSE parser ─────────────────────────────────────────────────
// Incremental, spec-compliant: CR/LF/CRLF, strips leading BOM,
// ignores ``:`` comment lines (so heartbeats never reach handlers),
// supports multi-line ``data:`` fields.
function makeSseParser(onMessage) {
  let buf = "";
  let bomStripped = false;
  return function feed(chunk) {
    if (!bomStripped) {
      if (chunk.charCodeAt(0) === 0xFEFF) chunk = chunk.slice(1);
      bomStripped = true;
    }
    buf += chunk.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLines = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith(":")) continue;      // comment / heartbeat
        if (!line.startsWith("data:")) continue; // ignore event:, id:, etc.
        dataLines.push(line.slice(5).replace(/^ /, ""));
      }
      if (!dataLines.length) continue;
      try {
        onMessage(JSON.parse(dataLines.join("\n")));
      } catch (e) {
        // Malformed JSON frame — drop silently; the server's next
        // snapshot (on reconnect) will put us back in sync.
      }
    }
  };
}

// ── 3. reducer ────────────────────────────────────────────────────
// snapshot replaces every section; section.update replaces one.
// __status is our local wire-type for connection state (not an SSE event).
const INITIAL = {sections: {}, connected: false, fallback: false, error: null};

function reducer(state, event) {
  switch (event.type) {
    case "snapshot":
      return {...state, sections: event.sections || {}, connected: true, fallback: false, error: null};
    case "section.update":
      if (!event.name) return state;
      return {
        ...state,
        sections: {...state.sections, [event.name]: event.data || {}},
      };
    case "__status":
      return {
        ...state,
        connected: !!event.connected,
        fallback: !!event.fallback,
        error: event.error || null,
      };
    case "__legacy":
      return {
        ...state,
        sections: {_legacy_md: {markdown: event.markdown || ""}},
      };
    default:
      return state;
  }
}

// ── 4. event-stream hook ──────────────────────────────────────────
const MAX_RECONNECT_ATTEMPTS = 5;
const BACKOFF_MS = [500, 1000, 2000, 4000, 8000, 10000];

function useEventStream(dispatch) {
  const abortRef = useRef(null);
  useEffect(() => {
    if (!KEY) {
      dispatch({type: "__status", connected: false, error: "no key"});
      return;
    }
    let cancelled = false;
    let attempts = 0;
    async function fallbackPoll() {
      try {
        const r = await fetch("/index.md?" + Date.now(), {cache: "no-store"});
        if (r.ok) {
          const md = await r.text();
          dispatch({type: "__legacy", markdown: md});
          dispatch({type: "__status", connected: false, fallback: true});
        }
      } catch (e) { /* silent */ }
    }
    async function connect() {
      while (!cancelled) {
        const ac = new AbortController();
        abortRef.current = ac;
        try {
          const r = await fetch("/api/events?k=" + encodeURIComponent(KEY), {
            headers: {Accept: "text/event-stream"},
            signal: ac.signal,
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          dispatch({type: "__status", connected: true, fallback: false});
          attempts = 0;
          const reader = r.body.getReader();
          const decoder = new TextDecoder("utf-8");
          const feed = makeSseParser(ev => dispatch(ev));
          while (!cancelled) {
            const {value, done} = await reader.read();
            if (done) break;
            feed(decoder.decode(value, {stream: true}));
          }
        } catch (e) {
          if (cancelled) return;
        }
        dispatch({type: "__status", connected: false, fallback: false});
        attempts++;
        if (attempts >= MAX_RECONNECT_ATTEMPTS) {
          // Degrade to the splice-rendered /index.md so the page stays
          // serviceable. Keep trying in the background every 30s; the
          // moment SSE comes back we flip out of fallback via snapshot.
          await fallbackPoll();
          await new Promise(res => setTimeout(res, 30000));
          attempts = MAX_RECONNECT_ATTEMPTS;
          continue;
        }
        const wait = BACKOFF_MS[Math.min(attempts, BACKOFF_MS.length - 1)];
        await new Promise(res => setTimeout(res, wait));
      }
    }
    connect();
    return () => {
      cancelled = true;
      if (abortRef.current) abortRef.current.abort();
    };
  }, [dispatch]);
}

// ── 5. UI ─────────────────────────────────────────────────────────
function renderMarkdown(md) {
  if (!md) return "";
  try {
    return window.marked.parse(md, {gfm: true, breaks: false});
  } catch (e) {
    return "<pre>" + (md || "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])) + "</pre>";
  }
}

function Section({name, data}) {
  const md = (data && data.markdown) || "";
  return React.createElement("section", {className: "sec", "data-section": name},
    React.createElement("h2", null, SECTION_LABELS[name] || name),
    React.createElement("div", {
      className: "sec-body",
      dangerouslySetInnerHTML: {__html: renderMarkdown(md)},
    })
  );
}

function App() {
  const [state, dispatch] = useReducer(reducer, INITIAL);
  useEventStream(dispatch);

  const legacyHref = "legacy.html" + location.search;
  let statusClass = "sse-status";
  let statusLabel = "connecting…";
  if (state.fallback) { statusClass += " fallback"; statusLabel = "fallback: /index.md"; }
  else if (state.connected) { statusClass += " live"; statusLabel = "live"; }
  else if (state.error) { statusClass += " off"; statusLabel = state.error; }

  const sections = SECTION_ORDER
    .filter(n => state.sections[n])
    .map(n => React.createElement(Section, {key: n, name: n, data: state.sections[n]}));

  const legacyFallback = state.sections._legacy_md
    ? React.createElement("div", {
        className: "sec-body",
        dangerouslySetInnerHTML: {__html: renderMarkdown(state.sections._legacy_md.markdown)},
      })
    : null;

  return React.createElement(React.Fragment, null,
    React.createElement("header", null,
      React.createElement("b", null, "Alice"),
      React.createElement("span", {className: "spacer"}),
      React.createElement("a", {href: legacyHref, title: "Pre-#639 markdown shell"}, "Classic view"),
      React.createElement("span", {className: statusClass}, statusLabel)
    ),
    React.createElement("main", null,
      !KEY && React.createElement("div", {className: "notice err"},
        "No key — open the link Alice sent once to install it."
      ),
      sections.length ? sections : (state.fallback ? null : React.createElement("div", {className: "notice"}, "Waiting for the first snapshot…")),
      legacyFallback
    )
  );
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body></html>
