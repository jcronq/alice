// Slice-1 (#881) — frontend slug of a bold item title, matching
// ``history.py::title_slug`` so item-history/<slug>.jsonl and
// threads/<slug>.jsonl line up with what the server wrote.
function titleSlug(title) {
  const trimmed = String(title || "").trim().replace(/[:.]+$/, "");
  return trimmed.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
}

function formatTimelineTime(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
}

// Chronological [{at, kind, label}] from the /api/history payload.
// Mirrors the legacy modal (#596) style but trimmed to what Slice-1
// needs: event line, thread message, commit/extra blurb.
function mergeHistoryRows(payload) {
  const rows = [];
  for (const e of (payload && payload.events) || []) {
    let label = e.type || "event";
    if (e.type === "appeared") {
      label = e.seeded ? "Already tracked" : "Added";
      if (e.section) label += " · " + e.section;
    } else if (e.type === "checked") label = "Checked off";
    else if (e.type === "unchecked") label = "Unchecked";
    else if (e.type === "text_changed") label = "Text changed";
    else if (e.type === "moved") {
      const to = e.to && (e.to.section || e.to.page) ? (e.to.section || e.to.page) : "elsewhere";
      label = "Moved → " + to;
    } else if (e.type === "removed") label = "Removed";
    rows.push({at: e.at, kind: "ev-" + e.type, label});
  }
  for (const m of (payload && payload.thread) || []) {
    const who = m.from === "jason" ? "You" : (m.from || "Alice");
    rows.push({
      at: m.at,
      kind: m.from === "jason" ? "ev-jason" : "ev-alice",
      label: who + ": " + (m.text || ""),
    });
  }
  for (const x of (payload && payload.extra) || []) {
    const label = x.sha
      ? (x.merge ? "Merged " : "Commit ") + String(x.sha).slice(0, 10) + ": " + (x.subject || "")
      : (x.text || x.subject || JSON.stringify(x));
    rows.push({at: x.at, kind: "ev-extra", label});
  }
  rows.forEach((r, i) => (r._i = i));
  rows.sort((a, b) => {
    const ta = a.at ? Date.parse(a.at) : 0;
    const tb = b.at ? Date.parse(b.at) : 0;
    return (isFinite(ta) ? ta : 0) - (isFinite(tb) ? tb : 0) || a._i - b._i;
  });
  return rows;
}

// Slice-timeline: ordered stage names + display labels. The server
// returns five entries per item in this exact order (see
// ``stage_runs.STAGES``) so the frontend never has to re-sort; we just
// walk the array and render dots in place.
const STAGE_LABELS = [
  {key: "design", label: "Design"},
  {key: "build", label: "Build"},
  {key: "review", label: "Review"},
  {key: "check", label: "Check"},
  {key: "merge", label: "Merge"},
];

// Slice-timeline: five-dot per-item stage progress strip. Reads from
// /api/item-timeline/<slug> and re-fetches when the ExpandedCard's
// refresh counter bumps (any action that writes a new run should
// bump it). Renders five dots regardless of data — unknown stages
// come back as ``status: "none"`` so the component never flickers
// between "loading" and "empty".
function TimelineDots({slug, refreshKey}) {
  const [state, setState] = useState({loading: true});
  useEffect(() => {
    let cancelled = false;
    setState(s => ({...s, loading: true}));
    (async () => {
      try {
        const r = await fetch("/api/item-timeline/" + encodeURIComponent(slug));
        const body = await r.json().catch(() => ({}));
        if (cancelled) return;
        if (!r.ok) {
          setState({error: body.error || ("HTTP " + r.status)});
          return;
        }
        const stages = Array.isArray(body && body.stages) ? body.stages : [];
        setState({stages});
      } catch (e) {
        if (!cancelled) setState({error: String(e && e.message || e)});
      }
    })();
    return () => { cancelled = true; };
  }, [slug, refreshKey]);
  const byKey = {};
  (state.stages || []).forEach(s => { if (s && s.stage) byKey[s.stage] = s; });
  const anyRuns = (state.stages || []).some(s => s && s.status && s.status !== "none");
  const title = stage => {
    const rec = byKey[stage.key];
    if (!rec || rec.status === "none") return stage.label + " — no runs yet";
    const l = rec.latest || {};
    const parts = [stage.label + " — " + rec.status];
    if (l.task_id) parts.push("task: " + l.task_id);
    if (l.started_at) parts.push("started " + l.started_at);
    if (l.ended_at) parts.push("ended " + l.ended_at);
    if (l.summary) parts.push(l.summary);
    if (rec.count && rec.count > 1) parts.push("(" + rec.count + " runs)");
    return parts.join(" · ");
  };
  return h("div", {className: "woy-stage-timeline", role: "group", "aria-label": "Stage timeline"},
    h("span", {className: "woy-stage-timeline-label"}, "Timeline"),
    h("div", {className: "woy-stage-dots"},
      STAGE_LABELS.map(stage => {
        const rec = byKey[stage.key] || {status: "none"};
        const status = rec.status || "none";
        return h("span", {
          key: stage.key,
          className: "woy-stage-dot status-" + status,
          "data-stage": stage.key,
          "data-status": status,
          title: title(stage),
          "aria-label": title(stage),
        },
          h("span", {className: "dot"}),
          h("span", {className: "label"}, stage.label),
        );
      })
    ),
    !anyRuns && !state.loading && !state.error
      ? h("span", {className: "woy-stage-empty"}, "No runs yet") : null,
    state.error ? h("span", {className: "woy-stage-err"}, state.error) : null,
  );
}

// Slice-effort: the 4-segment picker in ExpandedCard reads from this
// table. Order is load-bearing — the keyboard shortcuts 1/2/3/4 map
// to segments 0/1/2/3 — and the levels must match the server-side
// ``WOY_EFFORT_LEVELS`` tuple exactly.
const EFFORT_SEGMENTS = [
  {level: "spike", label: "Spike", title: "Spike — quickest; one-off probe"},
  {level: "prototype", label: "Prototype", title: "Prototype — happy path, no polish"},
  {level: "solid", label: "Solid", title: "Solid — tested, reviewed, shippable"},
  {level: "autonomous", label: "Autonomous", title: "Autonomous — full gate, self-merged"},
];

// Slice-2 (#881 follow-up): inline-expand card for a Waiting-on-you
// item. Replaces the side-sheet modal. Rendered via ``createPortal``
// into a ``<div class="woy-expand">`` that WaitingTable inserts
// immediately after the clicked ``<li>`` so the surrounding list stays
// visible. Carries timeline + Accept/Reject/Steer + reply composer.
function ExpandedCard({title, slug, externalLink, isPr, onClose, onDismissed}) {
  const [data, setData] = useState({loading: true});
  const [pages, setPages] = useState([]);
  const [reply, setReply] = useState("");
  const [sending, setSending] = useState(false);
  const [status, setStatus] = useState({});
  const [refresh, setRefresh] = useState(0);
  const [action, setAction] = useState({pending: null, done: null, error: null});
  const [steerText, setSteerText] = useState("");
  const [steering, setSteering] = useState(false);
  // Slice-effort: picker state for this item. ``level`` is one of
  // WOY_EFFORT_LEVELS or "" (unset). ``savingLevel`` tracks the
  // in-flight pick so the clicked segment can show a spinner-style
  // label without blocking the other segments from re-click.
  const [effortLevel, setEffortLevel] = useState("");
  const [effortSaving, setEffortSaving] = useState(null);
  const [effortError, setEffortError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setData({loading: true});
    (async () => {
      try {
        const r = await fetch("/api/history?slug=" + encodeURIComponent(slug));
        const body = await r.json().catch(() => ({}));
        if (cancelled) return;
        if (!r.ok) setData({error: body.error || ("HTTP " + r.status)});
        else setData({payload: body});
      } catch (e) {
        if (!cancelled) setData({error: String(e && e.message || e)});
      }
    })();
    return () => { cancelled = true; };
  }, [slug, refresh]);
  // Detail-page probe so the "Open detail page →" link only renders
  // for items that actually have a dedicated page under STATUS_DIR.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch("/api/pages");
        if (!r.ok) return;
        const body = await r.json().catch(() => []);
        if (!cancelled && Array.isArray(body)) setPages(body);
      } catch (e) { /* pages lookup is best-effort */ }
    })();
    return () => { cancelled = true; };
  }, [slug]);
  // Esc collapses the row (keeps the spatial model of "expanded row"
  // consistent with the modal's dismissal verb from Slice-1).
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  // Slice-effort: fetch any existing effort pick for this slug when
  // the card opens, and after a successful POST. Best-effort — if
  // /api/effort is unreachable we just show the unset chip.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch("/api/effort");
        if (!r.ok) return;
        const body = await r.json().catch(() => ({}));
        if (cancelled) return;
        const v = (body && typeof body === "object" ? body[slug] : "") || "";
        setEffortLevel(v);
      } catch (_) { /* effort lookup is best-effort */ }
    })();
    return () => { cancelled = true; };
  }, [slug, refresh]);
  const pickEffort = async level => {
    if (!KEY) return;
    if (effortSaving !== null) return;
    const next = level === effortLevel ? "" : level;
    setEffortSaving(next || "clear");
    setEffortError(null);
    const prior = effortLevel;
    // Optimistic — snap the pill so the keyboard-shortcut feels
    // instant. Rollback on failure.
    setEffortLevel(next);
    try {
      const r = await fetch("/api/effort", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: KEY, slug, level: next}),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.ok) {
        setEffortLevel(prior);
        setEffortError(body.error || ("HTTP " + r.status));
      }
    } catch (e) {
      setEffortLevel(prior);
      setEffortError(String(e && e.message || e));
    } finally {
      setEffortSaving(null);
    }
  };
  // Slice-effort: 1/2/3/4 map to Spike/Prototype/Solid/Autonomous
  // while the expanded card is on screen. We gate on focus so Jason
  // can still type ``1`` into the Steer input or reply composer; the
  // guard is ``activeElement`` tagName, which also skips the key when
  // a native select / contenteditable is up. Dep list includes
  // ``pickEffort`` so each render rewires against fresh
  // ``effortLevel`` state — stale closures would silently toggle
  // against last-render's level.
  useEffect(() => {
    const EFFORT_KEYS = {
      "1": "spike",
      "2": "prototype",
      "3": "solid",
      "4": "autonomous",
    };
    const onKey = e => {
      if (!(e.key in EFFORT_KEYS)) return;
      if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
      const active = document.activeElement;
      const tag = (active && active.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (active && active.isContentEditable) return;
      e.preventDefault();
      pickEffort(EFFORT_KEYS[e.key]);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [slug, pickEffort]);
  const send = async () => {
    const text = reply.trim();
    if (!text || sending || !KEY) return;
    setSending(true);
    setStatus({});
    try {
      const r = await fetch("/api/reply", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: KEY, item: title, thread: slug, page: "index", text}),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) setStatus({err: body.error || ("HTTP " + r.status)});
      else {
        setReply("");
        setStatus({ok: "sent"});
        setRefresh(n => n + 1);
      }
    } catch (e) {
      setStatus({err: String(e && e.message || e)});
    } finally {
      setSending(false);
    }
  };
  const runAction = async verb => {
    if (action.pending || action.done || !KEY) return;
    setAction({pending: verb, done: null, error: null});
    try {
      const r = await fetch("/api/woy-action", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: KEY, slug, action: verb}),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.ok) {
        setAction({pending: null, done: null, error: body.error || ("HTTP " + r.status)});
        return;
      }
      setAction({pending: null, done: {verb, at: Date.now(), merged: body.merged, msg: body.thread_message}, error: null});
      setRefresh(n => n + 1);
      if (body.dismissed && typeof onDismissed === "function") onDismissed(slug, verb, body.merged);
    } catch (e) {
      setAction({pending: null, done: null, error: String(e && e.message || e)});
    }
  };
  const sendSteer = async () => {
    const text = steerText.trim();
    if (!text || steering || !KEY) return;
    setSteering(true);
    try {
      const r = await fetch("/api/woy-steer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: KEY, slug, text}),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok || !body.ok) {
        setStatus({err: "Steer failed: " + (body.error || ("HTTP " + r.status))});
      } else {
        setSteerText("");
        setStatus({ok: "steer sent"});
        setRefresh(n => n + 1);
      }
    } catch (e) {
      setStatus({err: String(e && e.message || e)});
    } finally {
      setSteering(false);
    }
  };
  const acceptLabel = () => {
    if (action.done && action.done.verb === "accept") {
      return "Accepted " + ageString(new Date(action.done.at).toISOString(), Date.now());
    }
    if (action.pending === "accept") return "Accepting…";
    return isPr ? "Accept (merge)" : "Accept";
  };
  const rejectLabel = () => {
    if (action.done && action.done.verb === "reject") {
      return "Rejected " + ageString(new Date(action.done.at).toISOString(), Date.now());
    }
    if (action.pending === "reject") return "Rejecting…";
    return "Reject";
  };
  const hasDetail = pages.some(p => (p && p.slug === slug) || p === slug);
  const rows = data.payload ? mergeHistoryRows(data.payload) : [];
  const buttonsDisabled = !KEY || !!action.pending || !!action.done;
  return h("div", {className: "woy-expand", role: "region", "aria-label": "Thread for " + title},
    h("div", {className: "woy-expand-head"},
      h("h4", null, title),
      h("button", {
        className: "woy-expand-close",
        "aria-label": "Collapse",
        onClick: onClose,
      }, "×"),
    ),
    h("div", {className: "woy-actions-bar"},
      h("button", {
        onClick: () => runAction("accept"),
        disabled: buttonsDisabled,
        title: isPr ? "Merge this PR (gh pr merge --squash)" : "Accept and dismiss",
      }, acceptLabel()),
      h("button", {
        className: "reject",
        onClick: () => runAction("reject"),
        disabled: buttonsDisabled,
      }, rejectLabel()),
      action.error ? h("span", {className: "woy-action-status err"}, action.error) : null,
      action.done && action.done.merged === false ? h("span", {className: "woy-action-status err"}, "merge failed") : null,
      action.done && action.done.merged === true ? h("span", {className: "woy-action-status"}, "merged") : null,
    ),
    h("div", {className: "woy-steer"},
      h("input", {
        type: "text",
        value: steerText,
        onChange: e => setSteerText(e.target.value),
        placeholder: KEY ? "Steer: nudge the agent working on this…" : "Set the key (?k=…) to steer.",
        disabled: !KEY || steering,
        onKeyDown: e => {
          if (e.key === "Enter") { e.preventDefault(); sendSteer(); }
        },
      }),
      h("button", {onClick: sendSteer, disabled: !KEY || steering || !steerText.trim()},
        steering ? "Sending…" : "Steer"),
    ),
    // Slice-effort: 4-segment picker + unset-hint chip. Rendered
    // whether or not a KEY is present so Jason can see the current
    // state even on a read-only tab; buttons disable without a key.
    h("div", {className: "woy-effort-bar", role: "group", "aria-label": "Effort level"},
      h("span", {className: "woy-effort-label"}, "Effort"),
      h("div", {className: "woy-effort-picker"},
        EFFORT_SEGMENTS.map((seg, i) => h("button", {
          key: seg.level,
          className: effortLevel === seg.level ? "selected" : null,
          "data-level": seg.level,
          onClick: () => pickEffort(seg.level),
          disabled: !KEY || effortSaving !== null,
          title: KEY ? seg.title + " (press " + (i + 1) + ")" : "Set the key (?k=…) to pick effort.",
        }, seg.label, h("span", {className: "woy-effort-key"}, String(i + 1))))
      ),
      !effortLevel ? h("span", {className: "woy-effort-hint"}, "Set effort →") : null,
      effortSaving ? h("span", {className: "woy-effort-saving"}, "Saving…") : null,
      effortError ? h("span", {className: "woy-effort-err"}, effortError) : null,
    ),
    // Slice-timeline: five-dot per-item stage progress. Re-fetches
    // whenever the card's refresh counter bumps (reply, steer, accept/
    // reject — anything that could have written a new stage-run).
    h(TimelineDots, {slug, refreshKey: refresh}),
    hasDetail ? h("a", {className: "woy-detail-link", href: "#" + slug}, "Open detail page →") : null,
    externalLink ? h("a", {className: "woy-external-link", href: externalLink, target: "_blank", rel: "noopener noreferrer"}, "View on GitHub →") : null,
    data.loading ? h("p", {style: MUTED}, "Loading…")
      : data.error ? h("p", {style: {color: "var(--color-bad)"}}, "Could not load: " + data.error)
        : rows.length
          ? h("ol", {className: "woy-timeline"}, rows.map((r, i) =>
              h("li", {key: i, className: r.kind || ""},
                h("time", null, formatTimelineTime(r.at)),
                r.label)))

// Lazily fetch /api/pipeline-history for one item on demand. ``load``
// is idempotent: calling it twice returns the same promise. Shared by
// the drawer (first-expand) and the full page (first-mount).
function useItemHistoryFetch(itemId, {limit, enabled}) {
  const [state, setState] = useState({loading: true});
  useEffect(() => {
    if (!enabled || !itemId) return;
    let cancelled = false;
    setState({loading: true});
    (async () => {
      try {
        const qs = limit
          ? ("?item=" + encodeURIComponent(itemId) + "&limit=" + limit)
          : ("?item=" + encodeURIComponent(itemId) + "&limit=0");
        const r = await fetch("/api/pipeline-history" + qs);
        const payload = await r.json().catch(() => ({}));
        if (cancelled) return;
        if (!r.ok) {
          setState({error: payload.error || ("HTTP " + r.status)});
          return;
        }
        setState({loading: false, payload});
      } catch (e) {
        if (!cancelled) setState({error: String(e && e.message || e)});
      }
    })();
    return () => { cancelled = true; };
  }, [itemId, limit, enabled]);
  return state;
}

function PipelineRowDrawer({itemId}) {
  const state = useItemHistoryFetch(itemId, {limit: 10, enabled: true});
  if (state.loading) return h("p", null, "(loading…)");
  if (state.error) return h("p", null, "(couldn't load history: " + state.error + ")");
  const transitions = (state.payload && state.payload.transitions) || [];
  if (!transitions.length) {
    return h(React.Fragment, null,
      h("p", null, "(no transitions yet)"),
      h("p", {className: "drawer-see-all"},
        h("a", {
          href: "/history/" + encodeURIComponent(itemId),
          target: "_blank", rel: "noopener",
        }, "see all →")),
    );
  }
  return h(React.Fragment, null,
    h(FxTable, {
      columns: historyTimelineColumns(),
      rows: transitions.map((t, i) => ({...t, __key: i})),
    }),
    h("p", {className: "drawer-see-all"},
      h("a", {
        href: "/history/" + encodeURIComponent(itemId),
        target: "_blank", rel: "noopener",
      }, "see all →")),
  );
}

// ── 8b. Schedules panel (issue #810) ──────────────────────────────
// Read-only view of Alice's active scheduled jobs. Phase 1 scope: no
// cancel / inspect — just name, schedule summary, countdown to next
// fire, and last-run status. Prompts live on Speaking only and never
// enter the SSE payload (sources/schedules.py strips them on read).
function schedOutcomeBadge(outcome) {
  if (outcome === "ok") return "✅";
  if (outcome === "error" || outcome === "err") return "⚠️";
  return "⏸";
}
function liveCountdown(nextAt, nowMs) {
  // Server already emits a "next_run_label" ("in 5m") computed at the
  // tick time. To keep the UI feeling live between SSE ticks we
  // recompute it from the ISO next_run_at whenever we have it, so the
  // countdown ticks every second via nowMs. Falls back to the server
  // label when the ISO is missing / unparseable.
  if (!nextAt) return "";
  const t = Date.parse(nextAt);
  if (!isFinite(t)) return "";
  const dt = Math.floor((t - nowMs) / 1000);
  if (dt <= 0) return "overdue";
  if (dt < 60) return "in " + dt + "s";
  const m = Math.floor(dt / 60);
  if (m < 60) return "in " + m + "m";
  const hr = Math.floor(m / 60);
  if (hr < 24) return "in " + hr + "h";
  return "in " + Math.floor(hr / 24) + "d";
}
function SchedulesBody({jobs, nowMs}) {
  if (!jobs || !jobs.length) {
    return h("p", {className: "sched-empty"}, "No scheduled jobs.");
  }
  return h("ul", null, jobs.map(job => {
    const nextLabel = liveCountdown(job.next_run_at, nowMs) ||
      job.next_run_label || "";
    const overdue = nextLabel === "overdue";
    return h("li", {key: job.id},
      h("div", {className: "sched-row"},
        h("span", null,
          h("span", {className: "sched-badge",
                     title: "last run: " + (job.last_run_outcome || "never")},
            schedOutcomeBadge(job.last_run_outcome)),
          h("span", {className: "sched-id"}, job.id),
        ),
        h("span", {
          className: "sched-next" + (overdue ? " sched-overdue" : ""),
          title: job.next_run_at || "",
        }, nextLabel),
      ),
      h("div", {className: "sched-sched"},
        job.schedule_summary || job.cron || "(no schedule)",
      ),
      job.description
        ? h("div", {className: "sched-desc"}, job.description)
        : null,
      job.last_run_label
        ? h("div", {className: "sched-last"},
            "last ran " + job.last_run_label)
        : null,
    );
  }));
}
function SchedulesPanel({data, nowMs, ts}) {
  const jobs = (data && data.jobs) || [];
  const count = jobs.length;
  const stamp = stampText(ts, nowMs);
  const header = h("h3", null,
    h("span", null, "Schedules", count ? " (" + count + ")" : ""),

  return h(React.Fragment, null,

    ),

    ),
  );
}

function SectionTile({name, data, ts, nowMs}) {
  const fresh = freshnessFromTs(ts, nowMs);
  const stamp = stampText(ts, nowMs);
  const title = SECTION_LABELS[name] || (TIERS.some(t => !t.aside && t.sections.includes(name)) ? null : name);
  let inner;
  if (name === "your_todo") {
    inner = h(YourTodoBoard, {data, nowMs});
  } else if (name === "in_flight") {
    inner = h(InFlightBoard, {data, nowMs});
  } else if (name === "blocked") {
    inner = h(BlockedBoard, {data});
  } else if (name === "done_today") {
    inner = h(DoneTodayList, {
      prs: data && data.prs,
      asksResolved: data && data.asks_resolved,
    });
  } else if (name === "thinking_queue") {
    inner = h(ThinkingQueueBoard, {data});
  } else if (name === "system_health") {
    inner = h(SystemHealthBoard, {data, nowMs});
  } else {
    // Markdown-only fallback for any section the server starts
    // emitting before the shell learns a widget for it.
    inner = h(MarkdownZone, {markdown: (data && data.markdown) || ""});
  }
  return h("section", {className: "sec", "data-section": name},
    h(FreshnessTile, {title, dataFresh: fresh, stampText: title ? stamp : null}, inner),
  );
}

// A tier groups the section tiles that share an owner of the next
// action. Asides are collapsed disclosures; the rest are headed blocks.
// Issue #726: collapsed aside headers carry a count / status so problems
// are visible without expanding. Returns {text, bad}.
const POLLER_STALE_S = 900;
function asideSummary(tierId, sections, nowMs) {
  if (tierId === "thinking") {
    const d = sections.thinking_queue || {};
    if (d.available === false) return {text: "unavailable", bad: true};
    const n = d.total != null ? d.total : (d.rows || []).length;
    return {text: "(" + n + ")", bad: false};
  }
  if (tierId === "health") {
    const d = sections.system_health || {};
    const stale = (d.pollers || []).filter(p =>
      p.fetched_at == null || nowMs / 1000 - p.fetched_at > POLLER_STALE_S).length;
    const deployBad = (d.deploy || []).filter(r => !r.sha).length;
    const n = stale + deployBad;
    return n
      ? {text: "· " + n + (n === 1 ? " warning" : " warnings"), bad: true}
      : {text: "· all OK", bad: false};
  }
  return null;
}
function Tier({tier, summary, ts, nowMs, children}) {

// ── 9b. hash routing (#651) ──────────────────────────────────────
// ``#chat`` / ``#bugs`` / ``#resources`` / ``#review-<slug>`` pick
// which A2UI surface the shell mounts. Anything else falls through
// to the Overview board (``#``, ``#overview``, no hash at all).
// ``useHashRoute`` returns ``{route, slug}`` where route is
// "overview" | "chat" | "bugs" | "resources" | "review" and slug is
// only set for review.
function parseHash(raw) {
  const h = (raw || "").replace(/^#/, "");
  if (!h || h === "overview" || h === "index") return {route: "overview", slug: null};
  if (h === "chat" || parseMessageHash(h)) return {route: "chat", slug: null};
  if (h === "bugs") return {route: "bugs", slug: null};
  if (h === "resources") return {route: "resources", slug: null};
  if (h.startsWith("review-")) return {route: "review", slug: h.slice("review-".length)};
  return {route: "overview", slug: null};
}
function useHashRoute() {
  const [r, setR] = useState(() => parseHash(location.hash));
  useEffect(() => {
    const on = () => setR(parseHash(location.hash));
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return r;
}

// When the hash route lands on ``review-<slug>`` we tell the server
// which slug the A2UI ``page:review`` renderer should describe
// (sources/review.py:set_active_slug). ``/api/review`` already
// exists as the design-note body fetch; we piggy-back on it to set
// the active slug as a side effect.
function usePingReviewSlug(slug) {
  useEffect(() => {
    if (!slug) return;
    let cancelled = false;
    (async () => {
      try {
        await fetch("/api/review?slug=" + encodeURIComponent(slug) + "&" + Date.now());
      } catch (e) { /* best-effort — the next poll retries */ }
      if (cancelled) return;
    })();
    return () => { cancelled = true; };
  }, [slug]);
}

// ── 10. header ────────────────────────────────────────────────────
// Nav tabs: fetch pages.json so chat / bugs / review stay reachable
// from the reactive shell. All tabs link to ``#<slug>``; parseHash
// routes chat / bugs / review-<slug> to their A2UI surfaces and
// everything else falls through to the Overview board.
//
// ARIA tablist pattern (overview UX, PR ux/overview-tablist-keys):
// the <nav> carries ``role="tablist"``; each tab is ``role="tab"``
// with roving tabindex (the active tab is 0, the rest are -1) so Tab
// lands on the current tab and Left / Right / Home / End move between
// them. Pattern drawn from agent-ui-testing/README.md § Keyboard and
// accessibility ("Tab bar is a tablist; use Left, Right, Home and End
// to move between tabs"). Pure keyboard-only behaviour — mouse clicks
// keep working the same as before.

// Pure helper: next tab index for a key press. Exported-style name
// so the inline reducer-js test harness can slice it out.
function nextTabIndex(current, key, count) {
  if (!count) return 0;
  if (key === "ArrowLeft") return (current - 1 + count) % count;
  if (key === "ArrowRight") return (current + 1) % count;
  if (key === "Home") return 0;
  if (key === "End") return count - 1;
  return current;
}

function NavTabs() {
  const [pages, setPages] = useState([]);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch("pages.json?" + Date.now());
        if (!r.ok) return;
        const raw = await r.json();
        if (cancelled) return;
        const visible = raw.filter(p => !p.hidden && p.slug !== "index");
        if (!visible.some(p => p.slug === "chat")) {
          visible.push({slug: "chat", title: "Chat"});
        }
        setPages(visible);
      } catch (e) { /* nav is best-effort */ }
    })();
    return () => { cancelled = true; };
  }, []);
  const route = useHashRoute();
  const current = route.route === "review" ? "review-" + route.slug : route.route;
  // Overview is always first; the hardcoded header <a> that used to
  // render it is gone so the whole tab row lives inside one tablist.
  const tabs = [{slug: "overview", title: "Overview", href: "#"}]
    .concat(pages.map(p => ({slug: p.slug, title: p.title, href: "#" + p.slug})));
  const activeIdx = Math.max(0, tabs.findIndex(t => t.slug === current));
  const navRef = useRef(null);
  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k !== "ArrowLeft" && k !== "ArrowRight" && k !== "Home" && k !== "End") return;
    e.preventDefault();
    const next = nextTabIndex(activeIdx, k, tabs.length);
    const target = tabs[next];
    if (!target) return;
    // Setting location.hash triggers the hashchange listener in
    // useHashRoute, which re-renders this component with the new
    // active index. "overview" is the parseHash default, so empty-
    // hash-equivalent "#overview" works and is explicit.
    location.hash = target.slug === "overview" ? "overview" : target.slug;
    // Move focus to the newly-selected tab after the re-render so
    // the roving tabindex lands where the user expects.
    requestAnimationFrame(() => {
      if (!navRef.current) return;
      const el = navRef.current.querySelectorAll('[role="tab"]')[next];
      if (el && typeof el.focus === "function") el.focus();
    });
  }
  return h("nav", {
    className: "nav-tabs",
    "aria-label": "Primary",
    role: "tablist",
    ref: navRef,
    onKeyDown: onKey,
  }, tabs.map((t, i) => {
    const active = i === activeIdx;
    return h("a", {
      key: t.slug,
      href: t.href,
      title: t.title,
      role: "tab",
      "aria-selected": active ? "true" : "false",
      tabIndex: active ? 0 : -1,
      className: active ? "on" : null,
      "aria-current": active ? "page" : null,
    }, t.title);
  }));
}

// Apply persisted width preference once on load so the first paint is
// already at the right max-width (no jank-switch after the hook mounts).
function applyWidth() {
  const w = localStorage.getItem("alice-width") || "narrow";
  if (w === "wide") document.documentElement.setAttribute("data-width", "wide");
  else document.documentElement.removeAttribute("data-width");
}
applyWidth();

function ConfigGear() {
  const [open, setOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem("alice-theme") || "system");
  const [width, setWidth] = useState(() => localStorage.getItem("alice-width") || "narrow");
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    function onDoc(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  function pickTheme(v) {
    if (v === "system") localStorage.removeItem("alice-theme");
    else localStorage.setItem("alice-theme", v);
    setTheme(v);
    applyTheme();
  }
  function pickWidth(v) {
    localStorage.setItem("alice-width", v);
    setWidth(v);
    applyWidth();
  }
  return h("div", {className: "cfg-wrap", ref},
    h("button", {
      className: "hdr cfg-gear",
      onClick: () => setOpen(x => !x),
      title: "Settings",
      "aria-label": "Settings",
      "aria-haspopup": "true",
      "aria-expanded": open,
    },
      // Inline SVG for a consistent, large, crisp gear across
      // platforms — the Unicode gear glyph renders tiny and dull on
      // most fonts (what Jason flagged twice in a row).
      h("svg", {viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
                strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
                "aria-hidden": "true"},
        h("circle", {cx: 12, cy: 12, r: 3}),
        h("path", {d: "M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.3.63.94 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"}),
      ),
    ),
    open ? h("div", {className: "cfg-panel"},
      h("div", {className: "cfg-section"},
        h("div", {className: "cfg-label"}, "Theme"),
        h("div", {className: "cfg-row"},
          ["system", "light", "dark"].map(v => h("button", {
            key: v,
            className: "cfg-pill" + (theme === v ? " on" : ""),
            onClick: () => pickTheme(v),
          }, v === "system" ? "Auto" : v[0].toUpperCase() + v.slice(1))),
        ),
      ),
      h("div", {className: "cfg-section"},
        h("div", {className: "cfg-label"}, "Line length"),
        h("div", {className: "cfg-row"},
          ["narrow", "wide"].map(v => h("button", {
            key: v,
            className: "cfg-pill" + (width === v ? " on" : ""),
            onClick: () => pickWidth(v),
          }, v === "narrow" ? "Readable" : "Wide")),
        ),
      ),
    ) : null,
  );
}

// ── 10a. keyboard shortcuts (PR ux/overview-shortcuts-help) ──────
// Minimal power-user keyboard surface inspired by the agent-ui-testing
// reference (DESIGN.md:122-128): ``?`` opens a modal listing every
// shortcut (Esc closes, focus returns to prior focus), ``g`` then
// ``o`` / ``c`` / ``b`` within 1.5s navigates to Overview / Chat /
// Bugs. Nothing fires while focus is in an input or textarea, nothing
// fires with Ctrl / Meta / Alt (so browser shortcuts stay untouched),
// nothing fires while the help modal is open except its own Esc.

// Pure helper: given a key event (destructured for test-friendliness)
// and the current shortcut state, return the next action. Actions:
//   {type: "help"}            → open help modal
//   {type: "close"}           → close help modal (Esc while open)
//   {type: "nav", slug: "…"}  → navigate to a route slug
//   {type: "chord", key: "g"} → start a chord
//   null                      → no action
function interpretShortcut(ev, state) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return null;
  const tag = (ev.targetTagName || "").toLowerCase();
  const inField = tag === "input" || tag === "textarea" || tag === "select" || ev.isContentEditable;
  // Esc on an open modal closes it even when focus is in a field
  // (modal traps focus on open; this is the escape hatch).
  if (ev.key === "Escape" && state.helpOpen) return {type: "close"};
  if (inField) return null;
  // Help modal: `?` (Shift+/). When open, only Esc closes.
  if (state.helpOpen) return null;
  if (ev.key === "?" || (ev.key === "/" && ev.shiftKey)) return {type: "help"};
  // Chord: `g` then letter within 1.5s (handled by the component,
  // which times the chord out — this helper just names the second
  // keystroke mapping).
  if (state.chord === "g") {
    if (ev.key === "o") return {type: "nav", slug: "overview"};
    if (ev.key === "c") return {type: "nav", slug: "chat"};
    if (ev.key === "b") return {type: "nav", slug: "bugs"};
    // Any other key cancels the chord without firing anything.
    return {type: "chord", key: null};
  }
  if (ev.key === "g") return {type: "chord", key: "g"};
  return null;
}

// List of shortcut rows rendered in the help modal. Keep in sync with
// ``interpretShortcut`` — any user-visible key here must have a
// matching handler, and vice versa.
const SHORTCUT_ROWS = [
  {group: "Navigation", keys: ["g", "o"], label: "Go to Overview"},
  {group: "Navigation", keys: ["g", "c"], label: "Go to Chat"},
  {group: "Navigation", keys: ["g", "b"], label: "Go to Bugs"},
  {group: "Help", keys: ["?"], label: "Show this help"},
  {group: "Help", keys: ["Esc"], label: "Close help"},
];

function KeyboardShortcuts() {
  const [helpOpen, setHelpOpen] = useState(false);
  // ``chord`` is the first key of a pending chord ("g") or null.
  const chordRef = useRef(null);
  const chordTimerRef = useRef(null);
  // Remember who had focus before the modal opened so Esc can restore.
  const priorFocusRef = useRef(null);
  function clearChord() {
    chordRef.current = null;
    if (chordTimerRef.current) {
      clearTimeout(chordTimerRef.current);
      chordTimerRef.current = null;
    }
  }
  function startChord(k) {
    chordRef.current = k;
    if (chordTimerRef.current) clearTimeout(chordTimerRef.current);
    chordTimerRef.current = setTimeout(clearChord, 1500);
  }
  useEffect(() => {
    function onKey(e) {
      const action = interpretShortcut({
        key: e.key, shiftKey: e.shiftKey, ctrlKey: e.ctrlKey,
        metaKey: e.metaKey, altKey: e.altKey,
        targetTagName: e.target && e.target.tagName,
        isContentEditable: e.target && e.target.isContentEditable,
      }, {helpOpen, chord: chordRef.current});
      if (!action) return;
      if (action.type === "help") {
        e.preventDefault();
        priorFocusRef.current = document.activeElement;
        setHelpOpen(true);
        clearChord();
        return;
      }
      if (action.type === "close") {
        e.preventDefault();
        setHelpOpen(false);
        // Restore focus to wherever it was before the modal.
        const el = priorFocusRef.current;
        priorFocusRef.current = null;
        if (el && typeof el.focus === "function") {
          requestAnimationFrame(() => el.focus());
        }
        return;
      }
      if (action.type === "nav") {
        e.preventDefault();
        location.hash = action.slug;
        clearChord();
        return;
      }
      if (action.type === "chord") {
        e.preventDefault();
        if (action.key) startChord(action.key);
        else clearChord();
        return;
      }
    }
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("keydown", onKey);
      if (chordTimerRef.current) clearTimeout(chordTimerRef.current);
    };
  }, [helpOpen]);
  if (!helpOpen) return null;
  // Group rows by their ``group`` field for a clean two-column list.
  const groups = {};
  for (const row of SHORTCUT_ROWS) {
    (groups[row.group] = groups[row.group] || []).push(row);
  }
  return h("div", {
    className: "kb-help-backdrop",
    role: "dialog",
    "aria-modal": "true",
    "aria-labelledby": "kb-help-title",
    onClick: (e) => { if (e.target === e.currentTarget) setHelpOpen(false); },
  },
    h("div", {className: "kb-help", role: "document"},
      h("h2", {id: "kb-help-title"}, "Keyboard shortcuts"),
      Object.keys(groups).map(g => h("div", {key: g, className: "kb-group"},
        h("h3", null, g),
        h("ul", null, groups[g].map((r, i) => h("li", {key: i},
          h("span", {className: "kb-keys"},
            r.keys.map((k, j) => h(React.Fragment, {key: j},
              j ? h("span", {className: "kb-then"}, " then ") : null,
              h("kbd", null, k),
            )),
          ),
          h("span", {className: "kb-label"}, r.label),
        ))),
      )),
      h("p", {className: "kb-help-foot"},
        "Shortcuts pause while focus is in a text field or while this dialog is open."),
      h("button", {
        type: "button",
        className: "kb-help-close",
        onClick: () => setHelpOpen(false),
      }, "Close"),
    ),
  );
}

// ── 10b. /history/<id> page (issue #832) ─────────────────────────
// Full item-history page: real URL (not hash-based) so "see all →"
// from the drawer is a shareable, reload-safe deep link. The server
// serves ``index.html`` for any ``/history/*`` path (SPA shell) and
// this component reads ``location.pathname`` on mount, decodes the
// remainder, and fetches the full transition tail.
function ItemHistoryPage({itemId}) {
  const data = useItemHistoryFetch(itemId, {limit: 0, enabled: true});
  const back = h("p", {className: "back"},
    h("a", {href: "/"}, "← back to Overview"));
  if (!itemId) {
    return h("div", {className: "item-history-page"},
      back,
      h("p", {style: {color: "var(--color-bad)"}},
        "No item_id in URL. Expected /history/<item-id>."));
  }
  if (data.loading) {
    return h("div", {className: "item-history-page"},
      back, h("p", null, "(loading…)"));
  }
  if (data.error) {
    return h("div", {className: "item-history-page"},
      back,
      h("h1", null, itemId),
      h("p", {style: {color: "var(--color-bad)"}},
        "Could not load history: " + data.error));
  }
  const p = data.payload || {};
  const transitions = p.transitions || [];
  return h("div", {className: "item-history-page"},
    back,
    h("h1", null, p.title || itemId),
    h("p", {className: "meta"},
      h("code", null, itemId),
      " · ",
      p.state
        ? h(SmStatePill, {state: p.state})
        : h("span", null, "(no state)"),
      p.entered_at
        ? h("span", null, " · entered " + p.entered_at)
        : null,
    ),
    h("h2", null, "Transitions"),
    transitions.length
      ? h(FxTable, {
          columns: historyTimelineColumns(),
          rows: transitions.map((t, i) => ({...t, __key: i})),
        })
      : h("p", {style: MUTED}, "(no transitions recorded)"),
  );
}

// ``/history/<url-encoded-item-id>`` → decode remainder. The ``#``
// fragment never reaches the frontend from the server (strict HTTP
// spec), so ``location.pathname`` is the only place it matters
// and ``decodeURIComponent`` is enough to recover ``gh:owner/repo#N``.
function historyPathItemId() {
  const p = location.pathname || "";
  if (!p.startsWith("/history/")) return null;
  const rest = p.slice("/history/".length);
  if (!rest) return "";
  try { return decodeURIComponent(rest); }
  catch (e) { return rest; }
}

// ── 11. app ───────────────────────────────────────────────────────
// Issue #832 — SPA route for ``/history/<id>`` is handled by a
// completely separate component (``HistoryRoot``) mounted in place
// of the main ``App``. Doing the switch outside the hook body keeps
// us on the right side of the Rules of Hooks and avoids opening the
// SSE connection / event stream reducer when the user just wants a
// focused, read-only deep-link view.
function HistoryRoot({itemId}) {
  return h(React.Fragment, null,
    h("header", null,
      h("b", null, "Alice"),
      h("span", {className: "spacer"}),
    ),
    h("main", null,
      h(ItemHistoryPage, {itemId}),
    ),
  );
}

function App() {
  const [state, dispatch] = useReducer(reducer, INITIAL);
  useEventStream(dispatch);
  const nowMs = useNowTick(10000);
  const {route, slug} = useHashRoute();
  usePingReviewSlug(route === "review" ? slug : null);

  let statusClass = "sse-status";
  let statusLabel = "connecting…";
  if (state.connected) { statusClass += " live"; statusLabel = "live"; }
  else if (state.error) { statusClass += " off"; statusLabel = state.error; }

  // Route → content. Overview reuses the existing widget stack; A2UI
  // routes mount ``A2uiSurface`` with the matching ``page:<slug>``
  // section payload the broadcaster is already streaming.
  let content;
  let schedulesPanel = null;
  if (route === "overview") {
    const sections = TIERS
      .filter(t => t.sections.some(n => state.sections[n]))
      .map(t => h(Tier, {key: t.id,
          tier: t.id === "top" ? {...t, title: t.title + todoCountSuffix(state.sections.your_todo)} : t,
          summary: t.aside ? asideSummary(t.id, state.sections, nowMs) : null,
          ts: parseTs(state.ts[t.sections.find(n => state.sections[n])]),
          nowMs},
        t.sections.filter(n => state.sections[n]).map(n => h(SectionTile, {
          key: n, name: n,
          data: state.sections[n],
          ts: parseTs(state.ts[n]),
          nowMs,
        }))));
    content = sections.length
      ? sections
      : h("div", {className: "notice"}, "Waiting for the first snapshot…");
    // Issue #810: render schedules panel alongside Overview. Component
    // self-handles the empty state so we always mount it once the
    // snapshot has landed — otherwise the fixed panel would pop in
    // after a cron fires rather than greeting the user with
    // "No scheduled jobs."
    if (state.sections.schedules !== undefined) {
      schedulesPanel = h(SchedulesPanel, {
        key: "schedules",
        data: state.sections.schedules,
        ts: parseTs(state.ts.schedules),
        nowMs,
      });
    }
  } else {
    const key = route === "review" ? "page:review" : ("page:" + route);
    const payload = state.sections[key];
    const envelopes = payload && payload.a2ui;
    content = h(A2uiSurface, {
      key: route + ":" + (slug || ""),
      envelopes,
      surfaceId: route,
    });
  }

  return h(React.Fragment, null,
    h("header", null,
      h("b", null, "Alice"),
      h(NavTabs),
      h("span", {className: "spacer"}),
      h("span", {className: statusClass}, statusLabel),
      h("button", {
        type: "button",
        className: "hdr kb-help-trigger",
        title: "Keyboard shortcuts — ?",
        "aria-label": "Keyboard shortcuts",
        onClick: (e) => {
          // Reuse the same path as the ? key: dispatch a synthesised
          // keydown on window so the KeyboardShortcuts component owns
          // the open logic in one place.
          e.preventDefault();
          window.dispatchEvent(new KeyboardEvent("keydown", {key: "?", shiftKey: true}));
        },
      }, "?"),
      h(ConfigGear),
    ),
    h("main", null,
      !KEY && h("div", {className: "notice err"},
        "No key — open the link Alice sent once to install it."),
      content,
      // Mobile accordion slot — the panel's media queries hide the
      // desktop aside here and vice versa in the fixed-position
      // sidebar below.
      schedulesPanel,
    ),
    h(KeyboardShortcuts),
  );
}

// Pick which root to mount based on pathname before any hooks run.
// ``/history/<id>`` deep-links go to the focused view; everything
// else gets the normal dashboard shell.
const _historyItemId = historyPathItemId();
createRoot(document.getElementById("root")).render(
  _historyItemId !== null
    ? h(HistoryRoot, {itemId: _historyItemId})
    : h(App),
);
</script>
</body></html>
