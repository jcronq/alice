<!--
  Reactive status-site shell (#639 + #651).

  SSE-driven React shell. The first SSE frame is a full snapshot;
  subsequent `section.update` frames patch one section's state. Overview
  section payloads are typed dicts (``{markdown, rows, ...}``) rendered
  by the slice-2 widgets.

  Dynamic pages (Chat, Bugs, per-item Review) come through the same SSE
  stream as A2UI (``page:<slug>``) sections: each payload is
  ``{"a2ui": [createSurface, updateComponents, updateDataModel, ...]}``
  and renders through the generic ``A2uiSurface`` component. Hash routes
  (``#chat``, ``#bugs``, ``#review-<slug>``) pick which surface the
  shell mounts.

  ``legacy.html`` is still packaged for rollback — the "Classic view"
  header link points at it. Retirement is a follow-up PR per the design.
-->

<div id="root">Loading Alice…</div>
<script src="marked.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
<script type="module">
import React, {useEffect, useLayoutEffect, useReducer, useRef, useState} from "react";
import {createRoot} from "react-dom/client";
import {
  ACCEPT, CHAT_PAGE_SIZE, attachmentName, chatRowKey, earliestAt,
  HIGHLIGHT_MS, imageFilesFromClipboard, isNearBottom, isNearTop,
  messageAnchorId, MORE_REACTS, parseMessageHash, permalinkFor, QUICK_REACTS,
  quoteForReply, reactionsSignature, readAsBase64, replyPreview,
  shouldSubmitOnKey, summarizeReactions, validateAttachment,
} from "./chat-ux.js";
const h = React.createElement;

// ── 0. key + legacy redirect ──────────────────────────────────────
// Key handling mirrors legacy.html: ?k=<key> → localStorage → bare URL.
const url = new URL(location.href);
const kParam = url.searchParams.get("k");
if (kParam) {
  localStorage.setItem("alice-key", kParam);
  url.searchParams.delete("k");
  history.replaceState(null, "", url.pathname + (url.search ? "?" + url.search : "") + url.hash);
}
const KEY = localStorage.getItem("alice-key") || "";
// Dynamic pages (#651) render through the A2UI surface component in
// this same shell — no more redirect to legacy.html for chat / bugs /
// review. Pre-#651 ``?p=<slug>`` links are translated to the new
// ``#<slug>`` route once so bookmarks and surface notes keep working.
const LEGACY_PAGE = new URLSearchParams(location.search).get("p");
if (LEGACY_PAGE && LEGACY_PAGE !== "index") {
  const u = new URL(location.href);
  u.searchParams.delete("p");
  // ``?p=chat#msg-<at>`` permalinks (#668) keep their message fragment;
  // parseHash treats ``#msg-…`` as the chat route.
  if (!(LEGACY_PAGE === "chat" && parseMessageHash(u.hash))) u.hash = "#" + LEGACY_PAGE;
  history.replaceState(null, "", u.pathname + (u.search ? u.search : "") + u.hash);
}

// ── 1. theme toggle ───────────────────────────────────────────────
// ?theme=dark|light → localStorage → <html data-theme>. Default is
// "match system" (no data-theme attribute; the CSS media query owns
// it). Explicit override via ?theme sticks until Jason clears it.
const themeParam = new URL(location.href).searchParams.get("theme");
if (themeParam === "dark" || themeParam === "light") {
  localStorage.setItem("alice-theme", themeParam);
  const u = new URL(location.href);
  u.searchParams.delete("theme");
  history.replaceState(null, "", u.pathname + (u.search ? "?" + u.search : "") + u.hash);
} else if (themeParam === "system") {
  localStorage.removeItem("alice-theme");
}
function applyTheme() {
  const t = localStorage.getItem("alice-theme");
  if (t === "dark" || t === "light") {
    document.documentElement.setAttribute("data-theme", t);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
applyTheme();

// ── 2. section catalogue ──────────────────────────────────────────
// The Overview is split by WHO OWNS THE NEXT ACTION (#691): TOP is
// Jason's TODO, MIDDLE is Alice's active work (info only), BOTTOM is
// what already happened. Asides are collapsed disclosures for
// thinking's queue and system health.
const TIERS = [
  {id: "top", title: "Waiting on you", hint: "your next action", sections: ["your_todo"]},
  {id: "middle", title: "In flight", hint: "Alice's active work — nothing needed from you", sections: ["in_flight"]},
  {id: "bottom", title: "Recent", hint: "already handled", sections: ["done_today"]},
  {id: "thinking", title: "Thinking queue", aside: true, sections: ["thinking_queue"]},
  {id: "health", title: "System health", aside: true, sections: ["system_health"]},
];
const SECTION_ORDER = TIERS.flatMap(t => t.sections);
const SECTION_LABELS = {
  your_todo: "Your TODO",
  in_flight: "Alice's active work",
  done_today: "Done today",
  thinking_queue: "Thinking's work",
  system_health: "Health",
};

// ── 3. SSE parser ─────────────────────────────────────────────────
function makeSseParser(onMessage) {
  let buf = "";
  let bomStripped = false;
  return function feed(chunk) {
    if (!bomStripped) {
      if (chunk.charCodeAt(0) === 0xFEFF) chunk = chunk.slice(1);
      bomStripped = true;
    }
    buf += chunk.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLines = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith(":")) continue;
        if (!line.startsWith("data:")) continue;
        dataLines.push(line.slice(5).replace(/^ /, ""));
      }
      if (!dataLines.length) continue;
      try { onMessage(JSON.parse(dataLines.join("\n"))); }
      catch (e) { /* malformed frame — the next snapshot resyncs us */ }
    }
  };
}

// ── 4. reducer ────────────────────────────────────────────────────
// snapshot replaces every section + stamps its ts; section.update
// replaces one. ts is used by freshness tiles to tint by age.
const INITIAL = {
  sections: {}, ts: {},
  connected: false, fallback: false, error: null,
};
function reducer(state, event) {
  switch (event.type) {
    case "snapshot": {
      const next = {};
      for (const k of Object.keys(event.sections || {})) next[k] = event.ts;
      return {
        ...state,
        sections: event.sections || {},
        ts: {...state.ts, ...next},
        connected: true, fallback: false, error: null,
      };
    }
    case "section.update":
      if (!event.name) return state;
      return {
        ...state,
        sections: {...state.sections, [event.name]: event.data || {}},
        ts: {...state.ts, [event.name]: event.ts},
      };
    case "__status":
      return {
        ...state,
        connected: !!event.connected,
        fallback: !!event.fallback,
        error: event.error || null,
      };
    case "__legacy":
      return {
        ...state,
        sections: {_legacy_md: {markdown: event.markdown || ""}},
      };
    default:
      return state;
  }
}

// ── 5. event-stream hook ──────────────────────────────────────────
const MAX_RECONNECT_ATTEMPTS = 5;
const BACKOFF_MS = [500, 1000, 2000, 4000, 8000, 10000];
function useEventStream(dispatch) {
  const abortRef = useRef(null);
  useEffect(() => {
    if (!KEY) {
      dispatch({type: "__status", connected: false, error: "no key"});
      return;
    }
    let cancelled = false;
    let attempts = 0;
    async function fallbackPoll() {
      try {
        const r = await fetch("/index.md?" + Date.now(), {cache: "no-store"});
        if (r.ok) {
          const md = await r.text();
          dispatch({type: "__legacy", markdown: md});
          dispatch({type: "__status", connected: false, fallback: true});
        }
      } catch (e) { /* silent */ }
    }
    async function connect() {
      while (!cancelled) {
        const ac = new AbortController();
        abortRef.current = ac;
        try {
          const r = await fetch("/api/events?k=" + encodeURIComponent(KEY), {
            headers: {Accept: "text/event-stream"}, signal: ac.signal,
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          dispatch({type: "__status", connected: true, fallback: false});
          attempts = 0;
          const reader = r.body.getReader();
          const decoder = new TextDecoder("utf-8");
          const feed = makeSseParser(ev => dispatch(ev));
          while (!cancelled) {
            const {value, done} = await reader.read();
            if (done) break;
            feed(decoder.decode(value, {stream: true}));
          }
        } catch (e) {
          if (cancelled) return;
        }
        dispatch({type: "__status", connected: false, fallback: false});
        attempts++;
        if (attempts >= MAX_RECONNECT_ATTEMPTS) {
          await fallbackPoll();
          await new Promise(res => setTimeout(res, 30000));
          attempts = MAX_RECONNECT_ATTEMPTS;
          continue;
        }
        const wait = BACKOFF_MS[Math.min(attempts, BACKOFF_MS.length - 1)];
        await new Promise(res => setTimeout(res, wait));
      }
    }
    connect();
    return () => {
      cancelled = true;
      if (abortRef.current) abortRef.current.abort();
    };
  }, [dispatch]);
}

// ── 6. helpers: markdown, freshness, ages ─────────────────────────
function renderMarkdown(md) {
  if (!md) return "";
  try { return window.marked.parse(md, {gfm: true, breaks: false}); }
  catch (e) {
    return "<pre>" + (md || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) + "</pre>";
  }
}
function parseTs(iso) {
  if (!iso) return 0;
  const t = Date.parse(iso);
  return Number.isFinite(t) ? t : 0;
}
function freshnessFromTs(ts, nowMs) {
  if (!ts) return "ok";
  const ageSec = Math.max(0, (nowMs - ts) / 1000);
  if (ageSec < 300) return "ok";
  if (ageSec < 900) return "amber";
  return "red";
}
function stampText(ts, nowMs) {
  if (!ts) return "no update yet";
  const sec = Math.max(0, Math.floor((nowMs - ts) / 1000));
  if (sec < 60) return "updated " + sec + "s ago";
  const min = Math.floor(sec / 60);
  if (min < 60) return "updated " + min + "m ago";
  const hr = Math.floor(min / 60);
  const rm = min % 60;
  return "updated " + hr + "h" + (rm ? " " + rm + "m" : "") + " ago";
}
function ageString(createdIso, nowMs) {
  const t = parseTs(createdIso);
  if (!t) return "—";
  const sec = Math.max(0, Math.floor((nowMs - t) / 1000));
  if (sec < 60) return sec + "s";
  const min = Math.floor(sec / 60);
  if (min < 60) return min + "m";
  const hr = Math.floor(min / 60);
  const rm = min % 60;
  return hr + "h" + (rm ? " " + rm + "m" : "");
}
function ageStringSeconds(ageSec) {
  const s = Math.max(0, Math.floor(ageSec || 0));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const hr = Math.floor(m / 60);
  const rm = m % 60;
  return hr + "h" + (rm ? " " + rm + "m" : "");
}

// Re-tint freshness tiles every ~10s so an idle-but-stale panel drifts
// through ok → amber → red without needing a new SSE event.
function useNowTick(intervalMs) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), intervalMs || 10000);
    return () => clearInterval(id);
  }, [intervalMs]);
  return now;
}

// ── 7b. A2UI generic renderer (#651) ─────────────────────────────
// Walks the component tree the server describes as a flat adjacency
// list, resolves ``props.boundTo = "/path"`` against the surface's
// data model (RFC-6901 JSON pointer, keys only — no array-index
// support needed yet; the one place it'd help is inside the chat
// thread list which we already resolve manually). Unknown component
// types render as a visible ``<pre>`` dump so a schema drift is
// loud, not silent — same philosophy as _safe_render on the server.
function resolvePointer(data, pointer) {
  if (!pointer || pointer === "") return data;
  if (!pointer.startsWith("/")) return undefined;
  const parts = pointer.slice(1).split("/").map(s =>
    s.replace(/~1/g, "/").replace(/~0/g, "~"));
  let cur = data;
  for (const p of parts) {
    if (cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

// Replay an A2UI envelope list into a plain ``{components, data}``
// snapshot. Every ``section.update`` for a page reruns this fresh —
// the server emits the full list each tick, so idempotent replay is
// the whole story. ``null`` surface means "nothing to render".
function replayA2ui(envelopes) {
  if (!Array.isArray(envelopes) || !envelopes.length) return null;
  let surfaceId = null;
  const components = new Map();
  let data = {};
  for (const env of envelopes) {
    if (!env || typeof env !== "object") continue;
    const sid = env.surfaceId;
    if (!sid) continue;
    if (env.type === "createSurface") {
      surfaceId = sid;
      components.clear();
      data = env.data ? {...env.data} : {};
      for (const c of (env.components || [])) {
        if (c && c.id) components.set(c.id, c);
      }
    } else if (env.type === "updateComponents") {
      for (const c of (env.components || [])) {
        if (c && c.id) components.set(c.id, c);
      }
    } else if (env.type === "updateDataModel") {
      applyDataModel(data, env.path || "", env.value);
    } else if (env.type === "deleteSurface") {
      if (surfaceId === sid) return null;
    }
  }
  if (!surfaceId || !components.has("root")) return null;
  return {surfaceId, components, data};
}

function applyDataModel(data, pointer, value) {
  if (!pointer || pointer === "") {
    // Whole-document replace: mutate the caller's object in place so
    // the ``data`` reference held by replayA2ui stays consistent.
    for (const k of Object.keys(data)) delete data[k];
    if (value && typeof value === "object" && !Array.isArray(value)) {
      Object.assign(data, value);
    }
    return;
  }
  if (!pointer.startsWith("/")) return;
  const parts = pointer.slice(1).split("/").map(s =>
    s.replace(/~1/g, "/").replace(/~0/g, "~"));
  const last = parts.pop();
  let cur = data;
  for (const p of parts) {
    if (cur[p] == null || typeof cur[p] !== "object") cur[p] = {};
    cur = cur[p];
  }
  cur[last] = value;
}

// Post helper for button actions. ``kind`` is the semantic action
// string from the button's props (chat.send / review.approve / …);
// the switch maps each to the existing POST endpoint + payload shape
// so ``handle_chat`` / ``handle_review_action`` on the server stay
// untouched — A2UI only describes the UI around them.
async function dispatchA2uiAction(kind, {text, slug, files, replyTo}) {
  if (!KEY) return {ok: false, error: "no key"};
  if (kind === "chat.send") {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        key: KEY, text,
        files: (files || []).map(f => ({name: f.name, data: f.data})),
        ...(replyTo ? {reply_to: replyTo} : {}),
      }),
    });
    const j = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, error: j.error};
  }
  if (kind === "review.approve" || kind === "review.modify" || kind === "review.reject") {
    const action = kind.slice("review.".length);
    const r = await fetch("/api/review-action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, slug, action, notes: text || ""}),
    });
    const j = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, error: j.error};
  }
  return {ok: false, error: "unknown action: " + kind};
}

// Walker: render one component by id, resolving list children and
// data-model references as it goes. The React key is the component
// id — the server picks stable ids per surface. ``local`` is the
// per-surface in-component state (textarea values keyed by id,
// per-button send-status text) owned by ``A2uiSurface``.
function renderA2uiComponent(id, surface, local, setLocal) {
  const c = surface.components.get(id);
  if (!c) return null;
  const type = c.type || "";
  const props = c.props || {};
  const children = c.children || [];
  switch (type) {
    case "text": {
      const md = props.markdown || props.text || "";
      return h("div", {
        key: id,
        className: "a2ui-text" + (props.variant ? " " + props.variant.replace(/[^a-z0-9- ]/gi, "") : ""),
        dangerouslySetInnerHTML: {__html: renderMarkdown(String(md))},
      });
    }
    case "pill": {
      const bound = props.boundTo ? resolvePointer(surface.data, props.boundTo) : null;
      if (bound == null) return null;
      // Pill payloads are either a string, or a struct the client
      // flattens ("$0.10 est / $0.15 actual · Δ $0.05" for pricing).
      let label;
      if (typeof bound === "string") {
        label = bound;
      } else if (bound && typeof bound === "object") {
        const parts = [];
        if (bound.estimate) parts.push(bound.estimate + " est");
        if (bound.actual) parts.push(bound.actual + " actual");
        if (bound.delta) parts.push((bound.count ? "over by " : "Δ ") + bound.delta);
        label = parts.join(" / ") || JSON.stringify(bound);
        if (bound.count) label = "Total dispatch cost across " + bound.count + " bugs: " + label;
      } else {
        label = String(bound);
      }
      return h("span", {key: id, className: "fx-pill a2ui-pill", style: bound && bound.overrun ? {color: "#b45309", borderColor: "#f59e0b"} : undefined}, label);
    }
    case "textarea": {
      const current = local.textareas[id] ?? "";
      const submitBtn = props.submitId ? surface.components.get(props.submitId) : null;
      const withFiles = !!props.attachments;
      const pending = (local.attachments && local.attachments[id]) || [];
      const attachErr = (local.attachErr && local.attachErr[id]) || "";
      const ta = h("textarea", {
        className: "a2ui-textarea",
        placeholder: props.placeholder || "",
        "aria-label": props.ariaLabel || props.placeholder || "Message Alice",
        value: current,
        onChange: e => setLocal(s => ({
          ...s,
          textareas: {...s.textareas, [id]: e.target.value},
        })),
        onKeyDown: submitBtn ? (e => {
          if (!shouldSubmitOnKey(e)) return;
          e.preventDefault();
          runA2uiAction(props.submitId, submitBtn.props || {}, surface, local, setLocal);
        }) : undefined,
        onPaste: withFiles ? (e => {
          const imgs = imageFilesFromClipboard(e.clipboardData);
          if (!imgs.length) return;
          e.preventDefault();
          addA2uiFiles(id, imgs, local, setLocal);
        }) : undefined,
      });
      if (!withFiles) return h(React.Fragment, {key: id}, ta);
      const dragging = !!(local.dragging && local.dragging[id]);
      const setDragging = v => setLocal(s => ({...s, dragging: {...s.dragging, [id]: v}}));
      return h("div", {
        key: id,
        className: "a2ui-composer" + (dragging ? " dragging" : ""),
        onDragOver: e => { e.preventDefault(); if (!dragging) setDragging(true); },
        onDragLeave: () => setDragging(false),
        onDrop: e => {
          e.preventDefault();
          setDragging(false);
          addA2uiFiles(id, Array.from(e.dataTransfer.files || []), local, setLocal);
        },
      },
        local.replyTo ? h("div", {className: "a2ui-reply-chip", "data-testid": "reply-chip"},
          h("span", null, "↩︎ Replying to: " + (local.replyTo.preview || "message")),
          h("button", {
            type: "button", "aria-label": "Cancel reply",
            onClick: () => setLocal(s => ({...s, replyTo: null})),
          }, "×"),
        ) : null,
        // Pending attachments preview — renders ABOVE the textarea, inline
        // with Teams/Slack/Discord convention per Jason 2026-11-06 11:44.
        pending.length ? h("div", {className: "a2ui-attachments-preview"},
          pending.map((f, i) => h("span", {key: f.name + "-" + i, className: "a2ui-attachment"},
            f.type.startsWith("image/")
              ? h("img", {alt: "", src: "data:" + f.type + ";base64," + f.data})
              : null,
            f.name,
            h("button", {
              type: "button", "aria-label": "Remove " + f.name,
              onClick: () => setLocal(s => ({
                ...s,
                attachments: {...s.attachments, [id]: (s.attachments[id] || []).filter((_, j) => j !== i)},
              })),
            }, "×"),
          )),
        ) : null,
        ta,
        h("div", {className: "a2ui-composer-bar"},
          h("label", {className: "a2ui-attach"},
            "📎 Attach",
            h("input", {
              type: "file", multiple: true, accept: ACCEPT,
              "data-testid": "chat-file-input",
              onChange: e => {
                addA2uiFiles(id, Array.from(e.target.files || []), local, setLocal);
                e.target.value = "";
              },
            }),
          ),
          attachErr ? h("span", {className: "a2ui-attach-err"}, attachErr) : null,
          // Render the submit button inline on the right of the attach row
          // when the textarea declares a submitId. Keeps Send + Attach on
          // one line per Jason 2026-11-06 — the button is still a normal
          // top-level a2ui component so it can be omitted from the root
          // children list without losing its click handler.
          submitBtn ? h("div", {className: "a2ui-composer-send"},
            renderA2uiComponent(props.submitId, surface, local, setLocal)) : null,
        ),
      );
    }
    case "button": {
      const status = local.statuses[id] || "";
      const disabled = local.pending[id] || !KEY;
      const variant = props.variant ? " a2ui-btn-" + String(props.variant).replace(/[^a-z0-9-]/gi, "") : "";
      return h("div", {key: id, className: "a2ui-btn-row"},
        h("button", {
          className: "a2ui-btn" + variant,
          disabled,
          onClick: () => runA2uiAction(id, props, surface, local, setLocal),
        }, props.label || "Submit"),
        status ? h("span", {className: "sse-status" + (status.startsWith("Error") ? " off" : "")}, status) : null,
      );
    }
    case "list": {
      // Lists have two flavours:
      //   1. plain children — render each child component
      //   2. boundTo → the data at that pointer is a list of row
      //      objects (variant = "chat-thread" / "bugs-sections" / …)
      if (props.boundTo) {
        const rows = resolvePointer(surface.data, props.boundTo);
        if (props.variant === "chat-thread") {
          return h(ChatThread, {key: id, rows: rows || []});
        }
        return h("div", {key: id, className: "a2ui-list a2ui-" + (props.variant || "boundlist")},
          renderBoundList(id, props, rows || []));
      }
      const heading = props.heading;
      return h("div", {key: id, className: "a2ui-list a2ui-" + (props.variant || "list")},
        heading ? h("h3", null, heading) : null,
        children.map(cid => renderA2uiComponent(cid, surface, local, setLocal)),
      );
    }
    default:
      return h("pre", {
        key: id,
        className: "a2ui-unknown",
        style: {whiteSpace: "pre-wrap"},
      }, "unknown a2ui component: " + JSON.stringify(c));
  }
}

// Reply requests (#668): a message's "↩︎ Reply" button emits
// ``{at, quote, preview}``; the chat A2uiSurface owns the composer state
// and subscribes to fill the textarea.
const chatReplyStore = {
  listeners: new Set(),
  request(req) { for (const fn of this.listeners) fn(req); },
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
};

// Locally-known reactions per message ``at`` (#668), shown the moment a
// POST /api/chat/react returns, until the SSE tick carries the same
// state (or ~6 s pass — the server wins after that).
const OVERRIDE_TTL_MS = 6000;
const chatReactionStore = {
  overrides: {},
  listeners: new Set(),
  set(at, reactions) {
    this.overrides = {...this.overrides, [at]: {reactions, ts: Date.now()}};
    this._emit();
  },
  reconcile(rows) {
    const bySig = {};
    for (const m of rows) if (m.at) bySig[m.at] = reactionsSignature(m.reactions);
    const kept = {};
    for (const [at, o] of Object.entries(this.overrides)) {
      const fresh = Date.now() - o.ts < OVERRIDE_TTL_MS;
      if (fresh && bySig[at] !== reactionsSignature(o.reactions)) kept[at] = o;
    }
    if (Object.keys(kept).length !== Object.keys(this.overrides).length) {
      this.overrides = kept;
      this._emit();
    }
  },
  _emit() { for (const fn of this.listeners) fn(this.overrides); },
  subscribe(fn) {
    this.listeners.add(fn);
    fn(this.overrides);
    return () => this.listeners.delete(fn);
  },
};

async function postReaction(at, emoji, action) {
  if (!KEY) return;
  try {
    const r = await fetch("/api/chat/react", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, at, emoji, action}),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.reactions) chatReactionStore.set(at, j.reactions);
  } catch (_) { /* the next tick shows the server's truth */ }
}

// Scroll a message into the middle of the thread and flash it (#668).
//
// Image loads can push the target up/down AFTER the initial scrollIntoView,
// leaving the viewport near-but-not-on the target — Jason 2026-11-06 12:55
// EST: "The links to specific messages don't take me to that specific
// message. Maybe the img height is not accounted for?"
//
// Fix: observe the thread's children with a ResizeObserver and re-center
// the target on every reflow for a short window (2s). Also pin to image
// load events on the target itself and its preceding siblings — those are
// the images that can shift the target downward as they decode. The whole
// thing bails out on a manual scroll or on the 2s budget, whichever
// comes first.
function jumpToMessage(at) {
  const el = document.getElementById(messageAnchorId(at));
  if (!el) return false;
  // Initial scroll.
  el.scrollIntoView({block: "center"});
  el.classList.remove("highlight");
  void el.offsetWidth;
  el.classList.add("highlight");
  setTimeout(() => el.classList.remove("highlight"), HIGHLIGHT_MS + 100);

  // Re-anchor across image/working-group reflows.
  const thread = el.closest(".a2ui-chat-thread");
  if (!thread) return true;
  const recenter = () => el.scrollIntoView({block: "center"});
  let ro = null;
  try {
    ro = new ResizeObserver(recenter);
    for (const child of Array.from(thread.children)) ro.observe(child);
  } catch (_) { /* ResizeObserver unavailable — initial scroll is best-effort */ }
  // Re-center as images that precede the target finish decoding.
  const imgsBefore = [];
  for (const sib of Array.from(thread.children)) {
    if (sib === el) break;
    sib.querySelectorAll && imgsBefore.push(...sib.querySelectorAll("img"));
  }
  imgsBefore.push(...el.querySelectorAll("img"));
  const onLoad = () => recenter();
  for (const img of imgsBefore) {
    if (!img.complete) img.addEventListener("load", onLoad, {once: true});
  }
  // Bail out on manual scroll so we don't fight the user.
  let cancelled = false;
  const cancel = () => { cancelled = true; };
  thread.addEventListener("wheel", cancel, {once: true, passive: true});
  thread.addEventListener("touchmove", cancel, {once: true, passive: true});
  // Hard timeout.
  setTimeout(() => {
    if (ro) ro.disconnect();
    for (const img of imgsBefore) img.removeEventListener("load", onLoad);
  }, 2000);
  return true;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

// Sticky-to-bottom message list: starts pinned to the latest message,
// follows new messages while the user is within ~40px of the bottom,
// and leaves the scroll position alone once they scroll up. A
// ``#msg-<at>`` hash (#668) scrolls that message into view once it
// renders, and un-sticks the list so new ticks don't yank it away.
function ChatThread({rows}) {
  const ref = useRef(null);
  const stick = useRef(true);
  const prevCount = useRef(0);
  const jumped = useRef("");
  const [pending, setPending] = useState(() => chatPendingStore.pending);
  // atBottom drives whether the "Jump" button renders; hasUnread flips
  // its label from "To latest" to "To new message" when traffic lands
  // while the user is scrolled away.
  const [atBottom, setAtBottom] = useState(true);
  const [hasUnread, setHasUnread] = useState(false);
  useEffect(() => chatPendingStore.subscribe(setPending), []);
  useEffect(() => { chatPendingStore.reconcile(rows); }, [rows]);
  const [overrides, setOverrides] = useState(() => chatReactionStore.overrides);
  useEffect(() => chatReactionStore.subscribe(setOverrides), []);
  useEffect(() => { chatReactionStore.reconcile(rows); }, [rows]);
  const [hashAt, setHashAt] = useState(() => parseMessageHash(location.hash));
  useEffect(() => {
    const on = () => {
      jumped.current = "";
      setHashAt(parseMessageHash(location.hash));
    };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  // Infinite scroll (#671): the SSE snapshot only carries the recent
  // tail, so every row ever seen (snapshots + fetched older pages) is
  // accumulated here and survives the tail window sliding forward.
  const known = useRef(new Map());
  const loadingRef = useRef(false);
  const exhausted = useRef(false);
  const failed = useRef(false);
  const anchor = useRef(null);
  const [loadingOlder, setLoadingOlder] = useState(false);
  const [, bump] = useState(0);
  // Working-groups come only from the latest snapshot (their state
  // changes in place and old ones fall out of the window).
  for (const k of Array.from(known.current.keys())) {
    if (k.startsWith("wg:")) known.current.delete(k);
  }
  for (const r of rows) known.current.set(chatRowKey(r), r);
  const allRows = Array.from(known.current.values());
  const serverRows = pending.length
    ? allRows.filter(r => !serverRowMatchesPending(r, pending))
    : allRows;
  const atEpoch = m => { const t = Date.parse(m.at || ""); return Number.isNaN(t) ? 0 : t; };
  const merged = [...serverRows, ...pending].sort((a, b) => atEpoch(a) - atEpoch(b));
  const last = merged.length ? merged[merged.length - 1] : null;
  const lastKey = last ? (last._client_id || chatRowKey(last)) : "";
  const prevLastKey = useRef("");
  const canLoadOlder = () =>
    !loadingRef.current && !exhausted.current &&
    allRows.filter(r => r.variant !== "working-group").length >= CHAT_PAGE_SIZE;
  const loadOlder = async () => {
    const before = earliestAt(Array.from(known.current.values()));
    if (!before || loadingRef.current || exhausted.current) return;
    loadingRef.current = true;
    failed.current = false;
    setLoadingOlder(true);
    try {
      const r = await fetch(
        "/api/chat?before=" + encodeURIComponent(before) + "&limit=" + CHAT_PAGE_SIZE);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const older = Array.isArray(j.messages) ? j.messages : [];
      const el = ref.current;
      if (el) anchor.current = {height: el.scrollHeight, top: el.scrollTop};
      for (const m of older) known.current.set(chatRowKey(m), m);
      if (older.length < CHAT_PAGE_SIZE) exhausted.current = true;
    } catch (_) {
      failed.current = true;
    } finally {
      loadingRef.current = false;
      setLoadingOlder(false);
      bump(n => n + 1);
    }
  };
  // Keep the visible message pinned after older rows are prepended:
  // the content above grew by (scrollHeight delta), so shift scrollTop
  // by the same amount before paint.
  useLayoutEffect(() => {
    const el = ref.current;
    const a = anchor.current;
    if (!el || !a) return;
    anchor.current = null;
    el.scrollTop = a.top + (el.scrollHeight - a.height);
  });
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Mark new-unread only when the newest message changed (a tail
    // arrival, not an older page prepended) AND the user is scrolled
    // away from the bottom. Growth at the bottom with stick=true is
    // already auto-followed below.
    const grew = merged.length > prevCount.current && lastKey !== prevLastKey.current;
    prevCount.current = merged.length;
    prevLastKey.current = lastKey;
    const scroll = () => { if (stick.current) el.scrollTop = el.scrollHeight; };
    scroll();
    const ro = new ResizeObserver(scroll);
    for (const child of Array.from(el.children)) ro.observe(child);
    const raf = requestAnimationFrame(scroll);
    if (grew && !stick.current) setHasUnread(true);
    return () => { ro.disconnect(); cancelAnimationFrame(raf); };
  }, [merged.length, last && last.at, last && last.step_count]);
  // Short threads (e.g. a tall window) never scroll, so scrolling can't
  // trigger the fetch: keep pulling older pages until the thread overflows.
  useEffect(() => {
    const el = ref.current;
    if (el && !failed.current && isNearTop(el) && canLoadOlder()) loadOlder();
  }, [merged.length, loadingOlder]);
  const jumpToLatest = () => {
    const el = ref.current;
    if (!el) return;
    el.scrollTop = el.scrollHeight;
    stick.current = true;
    setAtBottom(true);
    setHasUnread(false);
  };
  const onScroll = e => {
    const nearBottom = isNearBottom(e.currentTarget);
    stick.current = nearBottom;
    setAtBottom(nearBottom);
    if (nearBottom) setHasUnread(false);
    if (isNearTop(e.currentTarget) && canLoadOlder()) loadOlder();
  };
  useEffect(() => {
    if (!hashAt || jumped.current === hashAt) return;
    if (jumpToMessage(hashAt)) {
      jumped.current = hashAt;
      stick.current = false;
      setAtBottom(false);
    } else if (!failed.current && canLoadOlder()) {
      // Permalink target predates the loaded window: page older history
      // until it renders (each page re-fires this effect).
      loadOlder();
    }
  }, [hashAt, merged.length, loadingOlder]);
  return h(React.Fragment, null,
    h("div", {
      ref,
      className: "a2ui-list a2ui-chat-thread",
      role: "log",
      "aria-live": "polite",
      "aria-label": "Chat transcript",
      onScroll,
    },
      loadingOlder ? h("div", {
        key: "loading-older",
        className: "chat-loading-older",
        "data-testid": "chat-loading-older",
      }, h("span", null, "loading older…")) : null,
      renderChatMessages(merged, overrides)),
    !atBottom ? h("button", {
      className: "chat-jump" + (hasUnread ? " unread" : ""),
      onClick: jumpToLatest,
    }, hasUnread ? "↓ To new message" : "↓ To latest") : null,
  );
}

const IMAGE_RE = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i;
function renderChatMessages(rows, overrides) {
  if (!rows.length) {
    return h("div", {className: "typing"}, "No messages yet. Say hi.");
  }
  const byAt = {};
  for (const m of rows) if (m.at && !m.variant) byAt[m.at] = m;
  // Keys must not depend on list position: older pages are prepended and
  // an index key would remount (and reload images of) every bubble.
  const keyCounts = new Map();
  return rows.map((m, i) => {
    const baseKey = (m._client_id || m.at || "") + "|" + (m.from || "");
    const dup = keyCounts.get(baseKey) || 0;
    keyCounts.set(baseKey, dup + 1);
    if (m.variant === "working-group") {
      return h(WorkingGroup, {key: "wg-" + (m.turn_id || i), group: m});
    }
    const reactions = (overrides && m.at && overrides[m.at])
      ? overrides[m.at].reactions : m.reactions;
    return h(ChatMessage, {
      key: baseKey + "-" + dup,
      m, reactions, quoted: m.reply_to ? byAt[m.reply_to] : null,
    });
  });
}

function ChatMessage({m, reactions, quoted}) {
  const [picker, setPicker] = useState(false);
  const [copied, setCopied] = useState(false);
  // Prefer the richer `attachments` shape (name, url) over the
  // legacy `files` name-only shape so historical messages still
  // render with a filename if the url isn't present.
  const atts = (m.attachments && m.attachments.length)
    ? m.attachments
    : (m.files || []).map(n => ({name: n}));
  const actionable = !!m.at && (!m._optimistic || m.status === "delivered");
  // Per-bubble status indicator for Jason's optimistic messages.
  // sending — in-flight; sent — single check; delivered — accent check.
  // Server rows (historical reload) have no status and get no indicator.
  let statusIcon = null;
  if (m.from === "jason" && m.status) {
    const icons = {sending: "◌ sending", sent: "✓ sent", delivered: "✓ delivered"};
    statusIcon = h("span", {className: "msg-status msg-status-" + m.status}, icons[m.status] || m.status);
  }
  const summary = summarizeReactions(reactions);
  const mine = new Set(summary.filter(r => r.mine).map(r => r.emoji));
  const react = emoji => {
    setPicker(false);
    postReaction(m.at, emoji, mine.has(emoji) ? "remove" : "add");
  };
  const btn = (testid, label, title, onClick, extra) => h("button", {
    type: "button", className: "msg-action", title, "aria-label": title,
    "data-testid": testid, onClick, ...extra,
  }, label);
  return h("div", {
    id: actionable ? messageAnchorId(m.at) : undefined,
    "data-at": m.at || undefined,
    className: "msg " + (m.from === "jason" ? "jason" : "alice") + (m.status ? " status-" + m.status : ""),
  },
    actionable ? h("div", {className: "msg-actions", "data-testid": "msg-actions"},
      QUICK_REACTS.map(e => btn("react-btn", e, "React " + e, () => react(e),
        {key: e, "data-emoji": e, className: "msg-action" + (mine.has(e) ? " mine" : "")})),
      btn("react-more", "+", "More reactions", () => setPicker(p => !p), {key: "more"}),
      btn("reply-btn", "↩︎ Reply", "Reply", () => chatReplyStore.request({
        at: m.at, quote: quoteForReply(m), preview: replyPreview(m),
      }), {key: "reply"}),
      btn("copy-link-btn", copied ? "✓ Copied" : "🔗 Copy link", "Copy link", async () => {
        if (await copyText(permalinkFor(location.origin, m.at))) {
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        }
      }, {key: "link"}),
      btn("more-menu", "⋯", "More actions — coming soon", undefined,
        {key: "menu", disabled: true}),
      picker ? h("div", {className: "msg-picker", key: "picker", "data-testid": "react-picker"},
        MORE_REACTS.map(e => btn("react-btn", e, "React " + e, () => react(e),
          {key: e, "data-emoji": e}))) : null,
    ) : null,
    m.reply_to ? h("button", {
      type: "button", className: "msg-reply-ref", "data-testid": "reply-ref",
      title: "Jump to the quoted message",
      onClick: () => {
        // Push the hash so the jump is also a bookmarkable permalink
        // (Jason explicitly asked for "a link to that other message").
        if (location.hash !== "#msg-" + m.reply_to) {
          history.pushState(null, "", location.pathname + location.search + "#msg-" + m.reply_to);
        }
        jumpToMessage(m.reply_to);
      },
    }, "In reply to: " + ((quoted && replyPreview(quoted)) || "an earlier message")) : null,
    m.text || "",
    ...atts.map((a, j) => {
      const name = a.name || "";
      const url = a.url;
      const isImage = url && IMAGE_RE.test(name);
      if (isImage) {
        const src = url + (url.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY || "");
        return h("div", {key: "f-" + j, className: "chat-image"},
          h("img", {src, alt: name, loading: "lazy"}));
      }
      return h("div", {key: "f-" + j, className: "chat-file"}, "📎 " + name);
    }),
    summary.length ? h("div", {className: "msg-reactions"},
      summary.map(r => h("button", {
        key: r.emoji, type: "button", "data-testid": "react-pill",
        className: "msg-react-pill" + (r.mine ? " mine" : ""),
        title: r.mine ? "Remove your reaction" : "React too",
        onClick: () => react(r.emoji),
      }, r.emoji + " " + r.count))) : null,
    h("small", null,
      (m.from === "jason" ? "You" : "Alice") + " · " + (m.at || ""),
      statusIcon ? " · " : null,
      statusIcon,
    ),
  );
}

// Per-turn working-status group (#656): "Alice is working…" plus one

function WorkingGroup({group}) {

// Read files into the composer's pending-attachment list for textarea ``id``.
async function addA2uiFiles(id, files, local, setLocal) {
  let count = ((local.attachments && local.attachments[id]) || []).length;
  const added = [];
  let err = "";
  files.forEach((file, i) => {
    const bad = validateAttachment(file, count + added.length);
    if (bad) { err = bad; return; }
    added.push({file, name: attachmentName(file, i)});
  });
  const loaded = [];
  for (const {file, name} of added) {
    try {
      loaded.push({name, type: file.type || "", data: await readAsBase64(file)});
    } catch (_) {
      err = "Could not read " + name + ".";
    }
  }
  setLocal(s => ({
    ...s,
    attachments: {...s.attachments, [id]: [...((s.attachments && s.attachments[id]) || []), ...loaded]},
    attachErr: {...s.attachErr, [id]: err},
  }));
}

// Shared by the Send button's click and the textarea's Enter key.
// Optimistic chat — a sent message is shown locally the instant the
// POST returns, without waiting for the next SSE tick (the broadcaster
// re-renders on a ~2 s cadence, so without this Jason saw a 1-2 s
// delay). The ChatThread subscribes to this store and merges pending
// messages below the server rows; a dedupe filter drops any pending
// whose (text, files) matches a server row from Jason in the recent
// tail, so the local echo quietly vanishes when the server catches up.
// Single-message optimistic flow (fix for Jason 2026-11-06 11:52 EST):
// the sent message is always the pending bubble — never a separate
// server echo. Status transitions in place: "sending" immediately on
// click, "sent" when POST returns, "delivered" when the SSE snapshot
// confirms the server stored it. Server-side rows that match a
// pending row (by text + file count) are hidden from render so there
// is never a two-bubble flash during the SSE-tick window.
const chatPendingStore = {
  pending: [],
  listeners: new Set(),
  add(msg) {
    this.pending = [...this.pending, msg];
    this._emit();
    return msg;
  },
  setStatus(client_id, status) {
    this.pending = this.pending.map(p =>
      p._client_id === client_id ? {...p, status} : p);
    this._emit();
  },
  reconcile(serverRows) {
    // When the server echoes a pending message, upgrade its status to
    // "delivered" and inherit the server's at / attachment URLs so
    // inline images render. The server row itself is hidden by
    // serverRowMatchesPending in the merge below.
    let changed = false;
    const tail = serverRows.slice(-20).filter(r => r.from === "jason");
    const next = this.pending.map(p => {
      if (p.status === "delivered") return p;
      const match = tail.find(r =>
        (r.text || "") === (p.text || "") &&
        ((r.files && r.files.length) || 0) === ((p.files && p.files.length) || 0),
      );
      if (!match) return p;
      changed = true;
      return {
        ...p,
        status: "delivered",
        at: match.at || p.at,
        attachments: match.attachments || p.attachments,
        files: match.files || p.files,
      };
    });
    if (changed) {
      this.pending = next;
      this._emit();
    }
  },
  _emit() { for (const fn of this.listeners) fn(this.pending); },
  subscribe(fn) {
    this.listeners.add(fn);
    fn(this.pending);
    return () => this.listeners.delete(fn);
  },
};

// A server row is a duplicate of one of our pending rows when they
// share from=jason, text, and file count. Hiding the server row keeps
// the pending bubble as the single rendered message with its own
// status transitions.
function serverRowMatchesPending(row, pending) {
  if (row.from !== "jason") return false;
  return pending.some(p =>
    (row.text || "") === (p.text || "") &&
    ((row.files && row.files.length) || 0) === ((p.files && p.files.length) || 0),
  );
}

async function runA2uiAction(id, props, surface, local, setLocal) {
  const action = props.action || "";
  const taId = props.textareaId || "";
  const text = taId ? (local.textareas[taId] ?? "") : "";
  const files = taId ? ((local.attachments && local.attachments[taId]) || []) : [];
  if (local.pending[id] || !KEY) return;
  if (action === "chat.send" && !text.trim() && !files.length) return;
  if (action === "review.modify" && !text.trim()) {
    setLocal(s => ({...s, statuses: {...s.statuses, [id]: "Say what to change first."}}));
    return;
  }
  if (action === "review.reject" && !confirm("Reject this plan?")) {
    return;
  }
  setLocal(s => ({
    ...s,
    pending: {...s.pending, [id]: true},
    statuses: {...s.statuses, [id]: ""},
  }));
  // Capture the composer state before awaiting the POST so the
  // optimistic bubble uses the text/files the user actually sent.
  const sentText = text;
  const replyTo = action === "chat.send" && local.replyTo ? local.replyTo.at : "";
  const sentFiles = files.map(f => ({name: f.name, type: f.type}));
  // Pre-flight pending row: appears instantly as "sending".
  let clientId = null;
  if (action === "chat.send") {
    clientId = "pending-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    chatPendingStore.add({
      _client_id: clientId,
      from: "jason",
      at: new Date().toISOString().replace("Z", "-0000"),
      text: sentText,
      files: sentFiles.map(f => f.name),
      attachments: sentFiles.map(f => ({name: f.name, type: f.type})),
      ...(replyTo ? {reply_to: replyTo} : {}),
      status: "sending",
      _optimistic: true,
    });
  }
  const res = await dispatchA2uiAction(action, {
    text,
    files,
    slug: surface.data && surface.data.slug,
    replyTo,
  });
  if (clientId) {
    if (res.ok) chatPendingStore.setStatus(clientId, "sent");
    // On POST failure the pending row stays at "sending"; it'll
    // disappear when the composer re-sends or the user reloads.
  }
  setLocal(s => {
    const next = {
      ...s,
      pending: {...s.pending, [id]: false},
      statuses: {...s.statuses, [id]: res.ok ? "" : ("Error: " + (res.error || res.status || "unknown"))},
    };
    if (res.ok && taId) {
      next.textareas = {...s.textareas, [taId]: ""};
      next.attachments = {...s.attachments, [taId]: []};
      next.attachErr = {...s.attachErr, [taId]: ""};
      next.replyTo = null;
    }
    return next;
  });
}

function renderBoundList(id, props, rows) {
  const variant = props.variant || "";
  if (variant === "bugs-sections") {
    return rows.map(sec => !sec.rows.length

          h("p", {className: "typing", style: {margin: ".25rem 0"}}, sec.heading + " (0)"))
      : h("section", {key: sec.key, className: "bugs-section"},
      h("h2", null, sec.heading),
      sec.rows.length
        ? h("ul", null, sec.rows.map(r => h("li", {key: r.id, style: r.stale ? {borderLeft: "3px solid #d9a441", paddingLeft: ".4rem"} : null},
            h("strong", null, r.title),
            r.summary_bits && r.summary_bits.length
              ? h("em", null, ": " + r.summary_bits.join(" — "))
              : null,
            r.pricing ? h("span", {className: "fx-pill", style: {marginLeft: ".4rem"}}, r.pricing) : null,
            r.meta || r.pr_url
              ? h("div", {style: {opacity: .65, fontSize: ".85em"}},

              : null,

        : h("p", {className: "typing"}, "(none yet)"),
    ));
  }
  // Fallback: dump each row as a <pre> so the drift is visible but
  // the whole surface doesn't go dark.
  return rows.map((r, i) => h("pre", {key: i}, JSON.stringify(r)));
}

function A2uiSurface({envelopes, surfaceId}) {
  // Local-only state: textareas and button pending/status. Replayed
  // from scratch each render so updateComponents never clobbers what
  // the user is typing (textarea ids are stable per surface).
  const [local, setLocal] = useState({textareas: {}, statuses: {}, pending: {}, attachments: {}, attachErr: {}, dragging: {}});
  const surface = React.useMemo(() => replayA2ui(envelopes), [envelopes]);
  // Reply requests from a message's action strip (#668): quote the
  // message into the surface's textarea and remember what it answers.
  useEffect(() => chatReplyStore.subscribe(req => {
    if (!surface || surface.surfaceId !== "chat") return;
    let taId = "";
    for (const [cid, c] of surface.components) if (c.type === "textarea") { taId = cid; break; }
    if (!taId) return;
    setLocal(s => {
      const existing = s.textareas[taId] || "";
      return {
        ...s,
        textareas: {...s.textareas, [taId]: req.quote + existing},
        replyTo: {at: req.at, preview: req.preview},
      };
    });
    setTimeout(() => {
      const ta = document.querySelector(".a2ui-composer textarea");
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 0);
  }), [surface]);
  if (!surface) {
    return h("div", {className: "notice"}, "Waiting for the " + surfaceId + " surface…");
  }
  return h("div", {className: "a2ui-surface a2ui-surface-" + surface.surfaceId},
    renderA2uiComponent("root", surface, local, setLocal),
  );
}

const MUTED = {color: "var(--color-fg-muted)", margin: 0};

function SectionTile({name, data, ts, nowMs}) {

const POLLER_STALE_S = 900;

  if (tierId === "thinking") {

    const n = d.total != null ? d.total : (d.rows || []).length;
    return {text: "(" + n + ")", bad: false};

// ── 9b. hash routing (#651) ──────────────────────────────────────
// ``#chat`` / ``#bugs`` / ``#review-<slug>`` pick which A2UI surface
// the shell mounts. Anything else falls through to the Overview
// board (``#``, ``#overview``, no hash at all). ``useHashRoute``
// returns ``{route, slug}`` where route is "overview" | "chat" |
// "bugs" | "review" and slug is only set for review.
function parseHash(raw) {
  const h = (raw || "").replace(/^#/, "");
  if (!h || h === "overview" || h === "index") return {route: "overview", slug: null};
  if (h === "chat" || parseMessageHash(h)) return {route: "chat", slug: null};
  if (h === "bugs") return {route: "bugs", slug: null};
  if (h.startsWith("review-")) return {route: "review", slug: h.slice("review-".length)};
  return {route: "overview", slug: null};
}
function useHashRoute() {
  const [r, setR] = useState(() => parseHash(location.hash));
  useEffect(() => {
    const on = () => setR(parseHash(location.hash));
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return r;
}

// When the hash route lands on ``review-<slug>`` we tell the server
// which slug the A2UI ``page:review`` renderer should describe
// (sources/review.py:set_active_slug). ``/api/review`` already
// exists as the design-note body fetch; we piggy-back on it to set
// the active slug as a side effect.
function usePingReviewSlug(slug) {
  useEffect(() => {
    if (!slug) return;
    let cancelled = false;
    (async () => {
      try {
        await fetch("/api/review?slug=" + encodeURIComponent(slug) + "&" + Date.now());
      } catch (e) { /* best-effort — the next poll retries */ }
      if (cancelled) return;
    })();
    return () => { cancelled = true; };
  }, [slug]);
}

// ── 10. header ────────────────────────────────────────────────────
// Nav tabs: fetch pages.json so chat / bugs / review stay reachable
// from the reactive shell. Chat / Bugs link to ``#chat`` / ``#bugs``
// (A2UI-rendered inside this shell, #651); everything else still
// points at legacy.html via ``?p=<slug>`` until the markdown-page
// pipeline moves across too.
const A2UI_SLUGS = new Set(["chat", "bugs"]);
function NavTabs() {
  const [pages, setPages] = useState([]);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch("pages.json?" + Date.now());
        if (!r.ok) return;
        const raw = await r.json();
        if (cancelled) return;
        const visible = raw.filter(p => !p.hidden && p.slug !== "index");
        if (!visible.some(p => p.slug === "chat")) {
          visible.push({slug: "chat", title: "Chat"});
        }
        setPages(visible);
      } catch (e) { /* nav is best-effort */ }
    })();
    return () => { cancelled = true; };
  }, []);
  const search = location.search;
  const route = useHashRoute();
  const current = route.route === "review" ? "review-" + route.slug : route.route;
  return pages.map(p => {
    const hashRoute = A2UI_SLUGS.has(p.slug);
    const href = hashRoute
      ? ("#" + p.slug)
      : ("legacy.html" + (search ? search + "&" : "?") + "p=" + encodeURIComponent(p.slug));
    const active = p.slug === current;
    return h("a", {
      key: p.slug, href, title: p.title,
      className: active ? "on" : null,
      "aria-current": active ? "page" : null,
    }, p.title);
  });
}

// ── 11. app ───────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, INITIAL);
  useEventStream(dispatch);
  const nowMs = useNowTick(10000);
  const {route, slug} = useHashRoute();
  usePingReviewSlug(route === "review" ? slug : null);

  const legacyHref = "legacy.html" + location.search;
  let statusClass = "sse-status";
  let statusLabel = "connecting…";
  if (state.fallback) { statusClass += " fallback"; statusLabel = "fallback: /index.md"; }
  else if (state.connected) { statusClass += " live"; statusLabel = "live"; }
  else if (state.error) { statusClass += " off"; statusLabel = state.error; }

  // Route → content. Overview reuses the existing widget stack; A2UI
  // routes mount ``A2uiSurface`` with the matching ``page:<slug>``
  // section payload the broadcaster is already streaming.
  let content;
  if (route === "overview") {
    const legacyPayload = state.sections._legacy_md;
    const sections = TIERS
      .filter(t => t.sections.some(n => state.sections[n]))
      .map(t => h(Tier, {key: t.id, summary: t.aside ? asideSummary(t.id, state.sections, nowMs) : null, tier: t.id === "top" ? {...t, title: t.title + todoCountSuffix(state.sections.your_todo)} : t},
        t.sections.filter(n => state.sections[n]).map(n => h(SectionTile, {
          key: n, name: n,
          data: state.sections[n],
          ts: parseTs(state.ts[n]),
          nowMs,
        }))));
    content = sections.length
      ? sections
      : (legacyPayload
          ? h(LegacySection, {data: legacyPayload})
          : (state.fallback ? null : h("div", {className: "notice"},
              "Waiting for the first snapshot…")));
  } else {
    const key = route === "review" ? "page:review" : ("page:" + route);
    const payload = state.sections[key];
    const envelopes = payload && payload.a2ui;
    content = h(A2uiSurface, {
      key: route + ":" + (slug || ""),
      envelopes,
      surfaceId: route,
    });
  }

  return h(React.Fragment, null,
    h("header", null,
      h("b", null, "Alice"),
      h("nav", {className: "nav-tabs"},
        h("a", {href: "#", title: "Overview"}, "Overview"),
        h(NavTabs),
      ),
      h("span", {className: "spacer"}),
      h("span", {className: statusClass}, statusLabel),
      h(ConfigGear, {legacyHref}),
    ),
    h("main", null,
      !KEY && h("div", {className: "notice err"},
        "No key — open the link Alice sent once to install it."),
      content,
    ),
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body></html>
