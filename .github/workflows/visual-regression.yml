name: visual-regression

# Status-site visual-regression gate. Advisory for now — a failing
# diff does NOT block merge (``continue-on-error: true`` on the diff
# step). Flip to required once baselines have survived a few PR
# cycles without false positives. See
# src/status_site/scripts/README.md.

on:
  pull_request:
    paths:
      - "src/status_site/**"
      - "tests/status_site/__screenshots__/**"
      - "tests/status_site/fixtures/**"
      - ".github/workflows/visual-regression.yml"

jobs:
  screenshot-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install python deps
        run: uv sync --frozen

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/status_site/scripts/package-lock.json

      - name: Install npm deps
        working-directory: src/status_site/scripts
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: src/status_site/scripts
        run: npx playwright install --with-deps chromium

      - name: Capture + diff screenshots
        id: diff
        working-directory: src/status_site/scripts
        continue-on-error: true
        run: |
          # ``uv run`` so python3 sees the project's dependencies.
          # The shell script shells back out to ``npm run screenshot``
          # once the fixture server is up.
          uv run --project "$GITHUB_WORKSPACE" bash ./run-with-fixtures.sh --diff

      - name: Upload current + diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-site-screenshots
          path: |
            tests/status_site/__screenshots__/current/
            tests/status_site/__screenshots__/diff/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report result
        if: always()
        run: |
          if [[ "${{ steps.diff.outcome }}" == "success" ]]; then
            echo "visual-regression: no diffs exceeded threshold"
          else
            echo "::warning title=visual-regression::screenshot diff failed; see artifact 'status-site-screenshots'"
          fi
