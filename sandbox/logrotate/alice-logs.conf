# Alice runtime log rotation. Driven by the alice-logrotate s6 longrun
# (sandbox/s6/alice-logrotate/run), which runs logrotate as root every
# 15 minutes; `su alice alice` makes every rotate/compress/create step
# act as the files' owner. Paths are container paths — /state is the
# host bind mount ~/.local/state/alice on aimax1.
#
# Policy: rotate any file past 256 MiB, keep 5 gzipped generations
# (worst case per file ≈ 256 MiB live + 256 MiB .1 + 4 × gz).
#
# Two stanzas because the writers differ:
#
#   1. Reopen-per-write JSONL event logs. core.events.EventLogger and
#      signal_outbound open(path, "a") → write one line → close on every
#      event, so a plain rename is lossless: the next emit creates a fresh
#      file. `delaycompress` keeps .1 uncompressed for one cycle so an
#      emit that opened the old inode just before the rename still lands
#      in a file nobody has gzipped yet.
#
#   2. Long-held O_APPEND fds: stderr of s6 services (redirfd -a 2 …,
#      held for the process lifetime — speaking's for weeks) and
#      signal-cli's `>>` stdout. These writers never reopen, so rename
#      would orphan their output; copytruncate instead. Every writer here
#      is O_APPEND, so after the truncate the next write lands at the new
#      EOF (no sparse NUL prefix). The only loss window is bytes written
#      between copy and truncate — milliseconds, stderr only.

su alice alice

/state/worker/thinking.log
/state/worker/speaking.log
/state/worker/memory-worker.log
/state/worker/signal-outbound.jsonl
{
    size 256M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    create 0644 alice alice
}

/state/worker/*-stderr.log
/state/worker/cozylobe.log
/state/daemon/signal-daemon.log
/state/viewer.log
{
    size 256M
    rotate 5
    missingok
    notifempty
    compress
    copytruncate
}
